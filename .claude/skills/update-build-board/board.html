     fixed, for the same reason `remeasured` below reads its swatch off one.
     This legend sits under the depth board, and a planned card is down there
     only when something blocks it: one with nothing in its way is drawn in the
     In flight section instead. So "ready to hand to a builder" is wrong under
     this board every time it appears, while the swatch itself is right. The
     card never says that, because the visible line drops the phrase when a
     blocker is named above it, so the legend would be the only surface making
     the claim.

     It asks `buildable`, the test the card's own suffix asks, rather than
     reading `needs` alone. Reading `needs` alone offered a deferred card with
     a `build` verdict to a builder while its kind word said not to start it.
     The gloss offers the marker to a builder only
     when every card drawing it is free, because a held card can sit beside a
     free one under "Planned, no builder", and one gloss for both would hand
     the held one over. A set mixing the two is sent to each card's own line,
     which is where the suffix appears or does not. A set with no free card
     names a blocker when every card has one, and otherwise says only that the
     card is not free. It gives no reason, because a card can be held by no
     row of `HOLDS` and draw no kind word, so a gloss pointing at the card's
     own reason would point at nothing there. */
  const buildWord = set => {
    const cs = set.filter(marked("build"));
    if (!cs.length) return null;
    const free = cs.filter(buildable).length;
    return ["plan-build", free === cs.length
      ? "plan run against the code, ready to hand to a builder"
      : free ? "plan run against the code, ready to build where its card says so"
      : cs.every(c => c.needs.some(b => by.has(b)))
        ? "plan run against the code, with a blocker still in front of it"
        : "plan run against the code, on a card that is not free to take"];
  };
  /* The swatch is read off the card that drew it rather than fixed here, so a
     re-measured `decide` card would not be advertised with the `build` colour.
     Only the wording is new: the mark itself is the one the plan already had. */
  const remeasured = set => {
    const c = set.find(remeasuring);
    return c ? ["plan-" + planMarker(c).ready,
      "plan run against the code, and a second loop re-measuring it"] : null;
  };
  legend("key", [
    /* First, because it is the only mark on a card that was shipped with no
       gloss anywhere a reader could see. It carried `title="priority order"`,
       which is a hover tooltip, so it did not exist on a touch screen and
       nobody discovered it on a desktop either. The `aria-label` spelled it out
       in full, which left a screen reader better informed than a sighted
       reader. Two readings of the page in one afternoon asked what the number
       was, and the second asked why a card showing 3 sat to the right of one
       showing 4. Both are this entry. */
    ...(drew(rest, c => rankMark(c))
      ? [["rk", "where it sits in the order work should land, so a blocker ranks ahead of what it frees"]] : []),
    /* The border says what kind of work a card is, and nothing more. "Work a
       session can take" read as a free claim under a ready card that waits on
       an open issue or that `HOLDS` keeps back, the same disagreement
       `buildable` settles. The card's own lines and the chain bar say whether it is
       free, so the gloss says only what the border shows. */
    ...(drew(rest, c => c.kind === "ready")
      ? [["ready", "ordinary work, which a session can take once nothing blocks or holds it"]] : []),
    ...(drew(rest, c => c.kind === "decision") ? [["decision", "needs the owner, not a session"]] : []),
    ...(drew(rest, c => c.kind === "deferred")
      ? [["deferred", "deferred on purpose, under the ranking rule"]] : []),
    ...(drew(rest, c => c.kind === "data") ? [["data", "waiting on data, so not a backlog"]] : []),
    ...(drew(rest, c => c.kind === "parent")
      ? [["parent", "a parent whose children carry the work"]] : []),
    ...(buildWord(rest) ? [buildWord(rest)] : []),
    ...(drew(rest, marked("decide"))
      ? [["plan-decide", "plan finished, one question left for the owner"]] : []),
    ...(remeasured(rest) ? [remeasured(rest)] : []),
    /* Never drawn today, because the In flight section takes every card with
       an open branch, which the comment on `HOLDS` explains. It stays so this
       legend keeps explaining the border if a change to `FLOW` lets one back. */
    ...(drew(rest, branched) ? [["has-pr", "a pull request carries it"]] : []),
    ...(drew(rest, c => workOn.has(c.n))
      ? [["busy", "a session is on it now, so nobody should start it again"]] : [])
  ]);
  const flown = TRACKER.filter(c => flight.has(c.n) && inMs(c));
  /* Both legends call the same `planMarker` the cards do, so neither can
     advertise a marker none of them drew. This one once did, offering "ready to
     hand to a builder" for a card whose pull request had retired that line,
     because the suppression rule was written out a second time here. */
  legend("flowkey", [
    /* The chip is drawn here too, so the gloss is too. A legend that explains a
       mark under one section and not under the other is the fixed-list defect
       with an extra step. */
    ...(drew(flown, c => rankMark(c))
      ? [["rk", "where it sits in the order work should land, so a blocker ranks ahead of what it frees"]] : []),
    ...(buildWord(flown) ? [buildWord(flown)] : []),
    ...(drew(flown, marked("decide"))
      ? [["plan-decide", "plan finished, one question left for the owner"]] : []),
    ...(remeasured(flown) ? [remeasured(flown)] : []),
    ...(drew(flown, branched) ? [["has-pr", "a pull request carries it"]] : []),
    /* Drawn here as well as on the board below, because a card can carry it in
       three of the five columns. Under "Waiting on my review" it is the mark of
       a branch whose session has not handed it over yet, which is what keeps a
       reviewed and green card out of the owner's column. */
    ...(drew(flown, c => workOn.has(c.n))
      ? [["busy", "a session is on it now, so nobody should start it again"]] : [])
  ]);

  /* The section's own heading note, computed rather than typed, because it names
     the keys the sort actually uses and any of them can empty. A typed note
     reading "priority, then how finished the plan is" advertises a ranking no
     card shows while `NEXT` holds nothing but a deferred card, which draws no
     position at all, and it can name the keys in the wrong order: `cardOrder`
     compares `planRank` before `rankOf`. A sentence in the page's furniture is
     easy to miss, because it describes no card.

     `planRank` is one comparison covering two facts. Only the readiness half is a
     key here. The deferred half gets its own sentence, because it is an override
     rather than a tiebreak and because a key carrying its own comma breaks the
     join around it: "deferred on purpose, which sorts last" and "the issue
     number" came back as one clause reading "which sorts last and the issue
     number". Keep every key a phrase with no comma in it. */
  const ranked = rest.filter(c => rankMark(c));
  const inRest = f => rest.some(f);
  /* The columns are depth, and a reader who takes them for priority meets a
     card numbered 3 sitting to the right of one numbered 4 and reads it as a
     contradiction. It is not one. The number is the order work should land in,
     and a blocker is ranked immediately ahead of what it frees, so a chain can
     run across the columns rather than down one.

     The sentence below names the cards actually in that position rather than
     describing the situation in general, so it leaves when they do, which is
     what it has just done, and it
     names them in the order it is explaining rather than in the order `rest`
     happens to hold. The preceding sentence used to rule out only dates, which
     is the misreading nobody made. A reader asked about priority within a
     minute of meeting the chips.

     One name for one thing. The key in the list above is called priority, so
     the sentence says the number is that priority rather than introducing a
     second word for it. */
  const rankedBehind = ranked.filter(c => c.needs.some(b => by.has(b)))
    .sort((a, b) => rankPos.get(a.n) - rankPos.get(b.n));
  /* Why no card below carries a position. Under one milestone whose ranked
     cards all sit in another, nothing ranked is out of reach, so the sentence
     says nothing in the milestone is ranked. Under one whose ranked cards are
     all deferred or in flight beside a ranked card elsewhere, it says that of
     the milestone alone. A deferred card is read through `rankMark`, so the
     rule that drops its position lives once. Every other case keeps the
     sentence the page drew before, All included, since `inMs` holds for every
     card there and neither test can pass. */
  const unkeyed = () => {
    const anybody = "nothing left in the ranking is a card anybody can take";
    const onTracker = NEXT_SORTED.map(it => by.get(it.issue)).filter(Boolean);
    const here = onTracker.filter(inMs);
    if (!here.length && onTracker.length) return `nothing${msWhere()} is ranked`;
    if (here.length < onTracker.length && here.every(c => !rankMark(c) || flight.has(c.n)))
      return `nothing${msWhere()} left in the ranking is a card anybody can take`;
    return anybody;
  };
  const keys = [];
  if (inRest(c => planOf.has(c.n))) keys.push("how finished the plan is");
  if (ranked.length) keys.push("priority");
  if (inRest(c => (c.after || []).some(b => by.has(b))))
    keys.push("an ordering somebody measured");
  keys.push("the issue number");
  document.getElementById("ordernote").innerHTML =
    `what can be started today, and what is behind what. Horizontal position is ` +
    `<b>dependency, never a date and never priority</b>. Within a column the order is ` +
    `<b>${andlist(keys)}</b>. ` +
    (rankedBehind.length
      ? `The number on a card is that priority. It orders what should land rather than ` +
        `what a session can start, so a card can sit further right than one carrying a ` +
        `higher number. A blocker ranks ahead of what it frees. ` +
        `${andlist(rankedBehind.map(c => `<b>#${c.n}</b>`))} ` +
        `${rankedBehind.length === 1 ? "is" : "are"} in that position today. `
      : ``) +
    (inRest(c => c.kind === "deferred")
      ? `Anything deferred on purpose sorts last whatever the rest of that says. ` : ``) +
    (ranked.length ? `` : `Priority is not a key today, because ${unkeyed()}. `) +
    `Pick a card to trace its chain.`;

  /* Counted rather than written down, because both numbers move whenever a card
     lands and a sentence that has to be remembered is a sentence that goes stale. */
  const ready = bucket[0].filter(c => c.kind === "ready");
  /* The graph's depth is read off the buckets rather than asserted, because a
     sentence naming a column is a sentence that goes false the moment the
     column empties, and one merge can empty a column. */
  /* The short view draws only ranked cards, so its third column can be empty
     while a hidden card sits two deep. A sentence calling the graph one level
     deep would then be false about the issues it hid. So the depth is counted
     over every open issue not in flight, and the sentence says so whenever that
     differs from what the columns show. A card waiting on data sits in its
     own column, outside the chain, so it counts toward no depth. */
  const graphed = open.filter(c => c.kind !== "data");
  const deep = graphed.filter(c => depth.get(c.n) >= 2).length;
  const deepHidden = deep !== bucket[2].length;
  /* How deep the graph goes and how many issues one card waits on are two
     facts, and one fixed sentence used to carry both. "Nothing sits behind more
     than one thing" meant that no chain ran two steps, and it reads as no card
     waiting on two issues, so it goes false on the reading a person gives it
     the moment one card waits on two open issues. The depth is the longest
     chain over the cards `deep` counts, so a
     third step is named rather than called the deepest the graph goes, and a
     card waiting on several open issues at once gets its own clause. */
  const longest = Math.max(0, ...graphed.map(c => depth.get(c.n)));
  const several = graphed.map(c => ({ n: c.n, on: c.needs.filter(b => by.has(b)) }))
    .filter(x => x.on.length > 1).sort((a, b) => a.n - b.n);
  /* The shallow branch needs the same qualifier as the deep one. With no card
     two steps behind, the short view can still hide every card one step
     behind, and the sentence then describes a column the reader sees empty. */
  const depthHidden = deep ? deepHidden : longest === 1 && !bucket[1].length;
  /* Subtracted rather than listed alongside, because a card somebody is already
     on is not work this reader can take, and a count that includes it is the
     sentence disagreeing with the one under it. `HOLDS` says what else is
     subtracted and why, and the chain bar reads the same test. */
  const free = ready.filter(takeable);
  /* The reasons a first-column card is not free are listed from the cards that
     are actually there, because a fixed list of three keeps offering reasons
     after the cards carrying them have gone. */
  const held = bucket[0].filter(c => !free.includes(c));
  const why = holding(held, "can");
  /* Every card tied at the top rather than whichever one sorted first. Taking
     [0] off a descending sort names one card and calls it "the single card",
     which is true only while nothing ties it. One close can leave two cards
     freeing two apiece, and the sentence would go on claiming one of them was
     alone. A count of zero drops the clause instead of reading "at 0 others",
     which is what it would say the moment the graph flattens. */
  /* At zero no card frees anything, so no card is tied at the top, and the
     list is empty rather than every card on the board. The freeing clause
     checks `most` itself. The two pointers below take their top cards from
     this list rather than checking `most`, so with every `needs` empty the
     note would say nothing was waiting and then name every card as in flight
     or hidden. A card waiting on
     two open issues makes each of them free at least one, so `several` is
     always empty at zero and the pointer loses nothing it should name. */
  /* Only the chosen milestone's cards are named, though each still counts
     everything it frees across the whole tracker. */
  const reachable = TRACKER.filter(inMs).map(c => ({ n: c.n, k: reach(c.n, feeds).size }));
  const most = Math.max(0, ...reachable.map(x => x.k));
  const unblocks = most ? reachable.filter(x => x.k === most) : [];
  /* The card that frees the most can be one the In flight section drew rather
     than one of the columns this sentence sits under, because the depth graph
     counts every blocker while the board draws only what nothing is carrying.
     Naming it with no explanation sends a reader hunting for it in a column it
     is not in. A card reaches that state when it becomes another's blocker
     while a session is still on it. */
  const flownTop = unblocks.filter(x => flight.has(x.n));
  /* The short view raises the same problem a second way. The freeing count
     reads every open issue, so the cards it counts, or the card that frees the
     most, can be ones this view left out. The sentence says when it is counting
     cards the reader cannot see, as the depth sentence does, and points at a
     hidden top card the way `flownTop` points at one in flight. A card the
     clause on several blockers names can be hidden the same way, so it joins
     the same pointer rather than getting a second sentence saying so. */
  const hiddenNamed = [...new Set([...unblocks, ...several].map(x => x.n))]
    .filter(n => !drawn.has(n)).sort((a, b) => a - b).map(n => ({ n }));
  /* A freed card can be hidden two ways. The short view hides one Show all
     can reveal, and the milestone filter hides one it cannot, so the sentence
     names them apart, as the chain bar does. */
  const freedHidden = unblocks.flatMap(x => [...reach(x.n, feeds)].filter(v => !drawn.has(v)));
  const freesHidden = freedHidden.some(v => inMs(by.get(v)));
  const freesAway = freedHidden.some(v => !inMs(by.get(v)));
  const counting = [
    ...(freesHidden ? ["the hidden issues"] : []),
    ...(freesAway ? ["cards in other milestones"] : [])
  ];
  /* The plan markers and the pull requests moved to the In flight section, which
     is the single authority for both. This note keeps only what the depth graph
     itself knows, so the two cannot say different things about one card. */
  /* The lead count agrees with its verb the way the sentences below already do.
     It was the one count here still typed as a plural, and it read "1 cards
     are free" the first time a single card was left free in the short view. An
     empty list drops its colon rather than ending on "first column: ." */
  document.getElementById("boardnote").innerHTML =
    `<b>${plu(free.length, "card")} ${free.length === 1 ? "is" : "are"} free for a session to take ` +
    `today</b>, out of ${bucket[0].length} in the first column` +
    `${free.length ? ": " + free.map(c => "#" + c.n).join(", ") : ""}. ` +
    (held.length
      ? `${plu(held.length, "card")} there ${held.length === 1 ? "is" : "are"} not free, ` +
        `because a card can ${orlist(why)}, and depth alone does not say what to pick. `
      : "") +
    (deep
      /* The verb agrees with the count rather than assuming it. `plu` handles the
         noun and left the verb fixed, which read "1 card sit" the first time a
         single card reached the third column, so the agreement is written
         wherever a count leads a verb. */
      ? `${depthHidden ? "Counting the hidden issues, " : ""}` +
        `${plu(deep, "card")} ${deep === 1 ? "waits" : "wait"} on an issue that waits on ` +
        `another, and the deepest is ${plu(longest, "step")} behind. `
      /* No chain at all says nothing here, because the second and third columns
         are then empty in both views and the freeing clause below already says
         when nothing waits on anything. */
      : longest
        /* Steps, the unit the column headings count in, rather than levels,
           which a reader counting columns would put one higher. */
        ? `${depthHidden ? "Counting the hidden issues, no card" : "No card"} waits on an issue ` +
          `that waits on another, so none is more than ${plu(longest, "step")} behind. `
        : ``) +
    /* Every card named here waits on all of its issues, so "and" and "each" are
       the right words, unlike the reasons above, which are alternatives. */
    (several.length === 1
      ? `#${several[0].n} waits on ${plu(several[0].on.length, "open issue")} at once, ` +
        `${andlist(several[0].on.map(b => "#" + b))}. `
      : several.length
        ? `${andlist(several.map(x => "#" + x.n))} each wait on more than one open issue. `
        : ``) +
    /* Under one milestone the sentence ranks that milestone's cards alone, so
       it says so, and a card there can wait on a card elsewhere while nothing
       waits on any card there. */
    (most
      ? (counting.length
          ? `Counting ${andlist(counting)}${freesHidden && depthHidden ? " too" : ""}, ` : "") +
        (unblocks.length === 1
          ? `<b>#${unblocks[0].n} is the single card${msWhere()} whose landing frees the most</b>, at ${plu(most, "other")}. `
          : `<b>${andlist(unblocks.map(x => "#" + x.n))} each free ${plu(most, "other")}</b>, and nothing${msWhere()} frees more. `)
      : MS === MS_ALL
        ? `No card here is waiting on another, so nothing is freed by landing anything. `
        : `Nothing waits on a card${msWhere()}, so landing one frees nothing. `) +
    (flownTop.length
      ? `${andlist(flownTop.map(x => "#" + x.n))} ${flownTop.length === 1 ? "is" : "are"} in the ` +
        `In flight section above rather than in a column here. `
      : ``) +
    (hiddenNamed.length
      ? `${andlist(hiddenNamed.map(x => "#" + x.n))} ${hiddenNamed.length === 1 ? "is" : "are"} ` +
        `hidden in this view, so press Show all to see ${hiddenNamed.length === 1 ? "it" : "them"}. `
      : ``) +
    (bucket.length > 3 && bucket[3].length
      ? `The fourth column is not a backlog, because nothing in it is waiting on anyone's time.`
      : ``);
}

/* The five states a card passes through between a plan being written and a
   merge. Each is decided by something observable rather than by a label somebody
   has to remember to move: whether a pull request exists, whether a review of it
   has been posted, whether its checks settled, and what kind of session is on
   it. A card lands in exactly one, and the tests run in order, so a pull request
   always outranks the session that produced it. Once a branch exists, the branch
   decides that the card sits in one of the two "Waiting on" columns, and the
   session still decides which.

   They read left to right from most finished to least, which is the opposite of
   the order the work happens in and the right way round for the question the
   section answers: what is nearly done, and what is barely started.

   The first two columns are the point of it. "Waiting on your review" is the
   only one where the next move is not mine. "Waiting on my review" is work this
   project's own rules count as unfinished, because a pull request is not handed
   over until it is reviewed, its session has finished with it and its checks have
   settled green. */
/* A branch is handed over when three things are done, not one or two. `CLAUDE.md`
   says a pull request is not handed over until its checks have run and settled,
   so a review on its own does not move a card into the owner's column. It did
   once, and the card read "2 checks still running" under a heading saying the
   next move was theirs, which invites a merge of a branch that can still go red.

   `checkword` returns "ok" only when every entry succeeded, so three states all
   stay on this side: a check still running, a check that failed, and no checks
   reported at all. The last is not an oversight. A conflicting pull request gets
   no run created, which `CLAUDE.md` records as its own failure mode, and a
   branch nothing built is not one to hand over either.

   The third thing is that the branch's own session has finished with it. A
   branch can be reviewed and green while its session is still pushing to it,
   and a card reading as the owner's then invites a merge of a moving head.
   Taking the `WORKING` entry out when the pull request opens drops the only
   signal the page has. So the entry stays until the session hands the branch
   over, and a card carrying one stays on this side. A session that ends without taking its entry out leaves
   its card under "Waiting on my review", which delays a merge rather than
   inviting one too early.

   `owed` is the rule, and it returns the first thing still owed or null once
   nothing is. The column test and the flow note both call it, so the reason a
   card gives for sitting on this side is the same rule that put it there. A
   rule written once for the test and again for the note would drift. */
const owed = (p, busy) =>
  !p.reviewed ? "review" : busy ? "session" : checkword(p.rollup)[0] !== "ok" ? "checks" : null;
const handedOver = (p, busy) => owed(p, busy) === null;

/* Five stages rather than four, because a session is not one state. A decompose
   loop and a build session are both somebody working, and they end in different
   things: a loop ends in a sharper plan and a builder ends in a branch. Drawing
   both under a heading reading "Building" said the wrong thing about five cards
   at once, so the loops get their own column at the far right, where the work is
   least finished. `kind` on a `WORKING` entry is what separates them, and an
   entry without one counts as a loop. */
const FLOW = [
  { t: "Waiting on your review", tone: "owner", d: "reviewed, checks settled green and no session listed on it, so the next move is not mine",
    has: (c, s) => s.pr && handedOver(s.pr, s.busy) },
  { t: "Waiting on my review", tone: "mine", d: "a branch exists and still owes a review, a green check or the rest of its session's work",
    has: (c, s) => s.pr && !handedOver(s.pr, s.busy) },
  { t: "Building", tone: "building", d: "a build session is on it and no branch has appeared",
    has: (c, s) => !s.pr && s.busy && s.busy.kind === "build" },
  { t: "Planned, no builder", tone: "planned", d: "a plan run against the code, nothing open that it waits on, and nobody on it",
    has: (c, s) => s.plan && !s.pr && !s.busy && !s.blocked && !s.landed },
  { t: "Being planned", tone: "planning", d: "a decompose loop is running, so the plan is still being written",
    has: (c, s) => !s.pr && s.busy && s.busy.kind !== "build" }
];

/* One ordering rule, shared by both sections. Sorting a column is the same
   question wherever the column is drawn: readiness first, then whatever the
   ranking decided, then an ordering somebody measured, then the issue number.
   Two sorts written separately are two sorts that can disagree about one pair,
   putting one card ahead of another in the grid while the ranking puts it
   behind. */
function cardOrder(by, planOf) {
  const nextRank = new Map(NEXT_SORTED.map((it, i) => [it.issue, i]));
  const rankOf = n => nextRank.has(n) ? nextRank.get(n) : 999;
  /* A card deferred on purpose sorts last whatever the ranking says about it,
     because the ranking only covers the top of the list and everything it omits
     falls back to one number. Without this, a deferred card sits near the top
     of a long column for the sole reason that the ranking mentions it at
     all. */
  const planRank = n => {
    const c = by.get(n);
    if (c && c.kind === "deferred") return 3;
    const x = planOf.get(n);
    return x ? (x.ready === "build" ? 0 : 1) : 2;
  };
  const softDepth = n => {
    const c = by.get(n);
    return c && (c.after || []).some(b => by.has(b)) ? 1 : 0;
  };
  return (a, b) =>
    planRank(a.n) - planRank(b.n) ||
    rankOf(a.n) - rankOf(b.n) ||
    softDepth(a.n) - softDepth(b.n) ||
    a.n - b.n;
}

/* The pull requests still open against a card. `PRS` also keeps a merged or
   closed entry while its issue stays open, so the card can say what became of
   it. Every reader asking whether a branch carries the card asks this, never
   whether `prOf` holds anything. Asking the second question holds a card back
   from the free list after its `Part of` has merged, as the comment on `HOLDS`
   says. It is one function rather than a filter at each site, because one
   condition written out in two places lets two sections disagree about one
   card. */
function openBranches(prOf, n) {
  return (prOf.get(n) || []).filter(p => p.state === "open");
}

/* Whether a merged pull request with no `Part of` stands against a card. Such
   a pull request was meant to close the issue, so its work has landed and only
   a close by hand is left. That is true whether or not GitHub registered the
   link, since a linked one whose card is still drawn means the tracker has not
   caught up with the close. Such a card is neither free nor waiting for a
   builder, which is why the free list, the plan
   marker, the kind word, the "Planned, no builder" column and the chain bar
   all ask this. */
function closesByHand(prOf, n) {
  return (prOf.get(n) || []).some(p => p.state === "merged" && !p.partOf);
}

function flightCols({ by, planOf, workOn, prOf }) {
  const stateOf = c => ({
    plan: planOf.get(c.n),
    busy: workOn.get(c.n),
    /* A finished plan behind an open blocker is not a card with no builder, it
       is a card nobody can start. A column test asking only whether a plan
       exists puts such a card under a heading offering it to a builder, and the
       card then reads "waits on" an issue and "ready to build" at once: a
       marker and a position answering one question two ways. */
    blocked: c.needs.some(b => by.has(b)),
    pr: openBranches(prOf, c.n)[0],
    /* A card whose pull request merged with no `Part of` has no builder to
       wait for, so it leaves "Planned, no builder" for the depth board, whose
       note holds it as needing only a close by hand. Left in the column, the
       note under it called such a card planned and free for anyone to pick up.

       `cardOrder` does not ask this, so a planned card held for a close by
       hand still sorts above unplanned cards in its column while drawing no
       marker. That is accepted rather than missed. The sort reads `PLANNED`
       rather than the marker on purpose, so a card keeps its position whether
       or not the marker is drawn, which the comment on `pn` in `card()`
       states. An open branch and a build session
       already sort that way, and a third exception would make the order
       depend on the same suppression rule the marker uses. */
    landed: closesByHand(prOf, c.n)
  });
  const cols = FLOW.map(() => []);
  TRACKER.forEach(c => {
    const s = stateOf(c);
    const i = FLOW.findIndex(f => f.has(c, s));
    if (i >= 0) cols[i].push(c);
  });
  cols.forEach(col => col.sort(cardOrder(by, planOf)));
  return cols;
}

/* The same split the section draws, as a set, so the depth board leaves out
   exactly what this section shows and neither can drift from the other. */
function flightOf(ctx) {
  return new Set(flightCols(ctx).flat().map(c => c.n));
}

function inFlight(ctx) {
  const { card } = ctx;
  /* Drawn for the chosen milestone only. `flightOf` still reads the whole
     tracker, so a card in flight never falls into the board below. */
  const cols = flightCols(ctx).map(col => col.filter(inMs));

  document.getElementById("flow").innerHTML = cols.map((col, k) => `
    <div class="col f-${FLOW[k].tone}">
      <div class="ch"><span class="t">${esc(FLOW[k].t)}</span><span class="c">${col.length}</span>
        <span class="d">${esc(FLOW[k].d)}</span></div>
      ${col.length ? col.map(card).join("") : `<div class="empty">nothing here</div>`}
    </div>`).join("");

  /* Written by walking the columns in the order they are drawn, so reordering
     the stages reorders the sentence with them. An index written here by hand
     is an index that outlives the arrangement it was counted from. */
  const ns2 = cs => andlist(cs.map(c => "#" + c.n));
  const say = {
    /* No split into settled and still-running. The note split that way for a
       while, which was the note coping with a column that should not have held
       an unsettled branch in the first place. `handedOver` fixed that above, so
       every card here has green checks by construction and the second half could
       only ever be empty. A note working around a wrong test is a second place
       for the rule to live.

       "Waiting on nothing else" is said only of a card whose own line names
       nothing it waits on. As fixed text, it told a reviewed, green card
       reading "waits on #N" that it waited on nothing, in the sentence the owner reads before merging. Such a card
       still sits in this column, because the column says whose move it is and
       nothing is left for a session: waiting for the blocker, or merging in
       the order an `after` line asks, is the owner's call. So the sentence
       names what the card waits on, read from `needs` and `after` the way the
       card's own line reads them, and in the card's own words. */
    owner: col => {
      const open = ns => ns.filter(b => ctx.by.has(b));
      const links = ns => andlist(ns.map(b => "#" + b));
      const clear = col.filter(c => !open(c.needs).length && !open(c.after || []).length);
      const parts = [];
      if (clear.length) parts.push(`<b>${ns2(clear)} ${clear.length === 1 ? "is" : "are"} yours</b>, ` +
        `reviewed, checks green, no session listed on ${clear.length === 1 ? "it" : "them"}, ` +
        `and waiting on nothing else`);
      col.filter(c => !clear.includes(c)).forEach(c => {
        const hard = open(c.needs), soft = open(c.after || []);
        parts.push(`<b>#${c.n} is yours${parts.length ? " too" : ""}</b>, reviewed, checks green and ` +
          `no session listed on it, but ${hard.length
            ? `it waits on ${links(hard)}${soft.length ? ` and should also land after ${links(soft)}` : ""}`
            : `it should land after ${links(soft)}`}`);
      });
      return parts.join(". ");
    },
    /* Three different things keep a card here, and calling them all "unreviewed"
       is the note contradicting the card above it, which reports the checks and
       the session. So the reason is read per card from `owed`, the same rule
       that put the card in this column, rather than assumed. */
    mine: col => {
      const openPr = c => openBranches(ctx.prOf, c.n)[0];
      const why = c => owed(openPr(c), ctx.workOn.get(c.n));
      const unreviewed = col.filter(c => why(c) === "review");
      const working = col.filter(c => why(c) === "session");
      const unsettled = col.filter(c => why(c) === "checks");
      const parts = [];
      if (unreviewed.length) parts.push(`${ns2(unreviewed)} ` +
        `${unreviewed.length === 1 ? "is" : "are"} written and unreviewed`);
      if (working.length) parts.push(`${ns2(working)} ` +
        `${working.length === 1 ? "is reviewed while a session is" : "are reviewed while sessions are"} ` +
        `still working on ${working.length === 1 ? "it" : "them"}`);
      if (unsettled.length) parts.push(`${ns2(unsettled)} ` +
        `${unsettled.length === 1 ? "is reviewed and its checks have" : "are reviewed and their checks have"} ` +
        `not settled green`);
      /* Each reason carries its own "and", so the join between them keeps a
         comma before its last "and". `andlist` drops that comma, which ran two
         reasons together as "written and unreviewed and #N is reviewed". */
      return parts.slice(0, -1).join(", ") + (parts.length > 1 ? ", and " : "") +
        parts[parts.length - 1] + `, which this project's rules count as ` +
        `unfinished rather than as handed over`;
    },
    building: col => `${ns2(col)} ${col.length === 1 ? "has a build session" : "have build sessions"} on ` +
      `${col.length === 1 ? "it" : "them"} and no branch yet`,
    planning: col => `${ns2(col)} ${col.length === 1 ? "is" : "are"} under a decompose loop, so what ` +
      `comes back is a sharper plan and possibly new cards rather than a branch`,
    /* The free claim reads `takeable`, the test the board note's free list and
       the chain bar read, and a held card is given the reasons `HOLDS` names
       for it in the bar's own words. Asking only whether the plan waits on the
       owner would call a deferred, decision or parent card with a finished plan
       free here while the bar said it was not. A card held for a reason no row
       names, such as a kind added later without a row, is told only that it is
       not free. Cards held
       for the same reasons share a sentence, and every reason in one applies to
       each of its cards, so they take "and" as the bar's do. */
    planned: col => {
      const free = col.filter(ctx.takeable);
      const held = new Map();
      col.filter(c => !free.includes(c)).forEach(c => {
        const why = andlist(ctx.holding([c], "is"));
        held.set(why, (held.get(why) || []).concat([c]));
      });
      const parts = [];
      if (free.length) parts.push(`${ns2(free)} ${free.length === 1 ? "is" : "are"} planned and ` +
        `free for anyone to pick up`);
      /* "too" only reads after a sentence saying another card is planned, and
         the free one drops out whenever no planned card is free. */
      held.forEach((cs, why) => parts.push(`${ns2(cs)} ${cs.length === 1 ? "is" : "are"} planned` +
        `${parts.length ? " too" : ""}, and ${cs.length === 1 ? why || "is not free to take"
          : why ? `each ${why}` : "none of them is free to take"}`));
      return parts.join(". ");
    }
  };
  const bits = cols
    .map((col, k) => col.length ? say[FLOW[k].tone](col) : "")
    .filter(Boolean);

  /* A second open branch on one card is a fact about branches, so it is
     reported where the branches are rather than under a board that no longer
     draws them. */
  const withPr = cols.filter((_, k) => FLOW[k].tone === "owner" || FLOW[k].tone === "mine").flat();
  const openPrs = c => openBranches(ctx.prOf, c.n);
  const contested = withPr.filter(c => openPrs(c).length > 1);
  if (contested.length) bits.push(`<b>${ns2(contested)} carries more than one open branch</b>, ` +
    `and merge order decides which lands while neither body can know it`);

  /* An ordering between two cards only becomes a decision once both are branches,
     because until then nothing can be merged in the wrong order. So it is said
     here, in the pull requests' own words, rather than only on the card. */
  const pairs = [];
  withPr.forEach(c => (c.after || []).forEach(b => {
    const first = withPr.find(x => x.n === b);
    if (first) pairs.push([openPrs(first)[0], openPrs(c)[0], first, c]);
  }));
  pairs.forEach(([a, z, ca, cz]) => bits.push(
    `<b>PR #${a.pr} merges before PR #${z.pr}</b>, because #${cz.n} should land after #${ca.n}. ` +
    `Nothing enforces that, so it is the order they are merged in and not something a check ` +
    `will catch`));

  /* The board below can be showing only the ranked cards, so "every other card"
     needs the count it is not drawing. */
  const hiddenNote = HIDDEN
    ? ` ${HIDDEN} of them ${HIDDEN === 1 ? "shows" : "show"} only with Show all.`
    : ``;
  /* Under one milestone the board below draws that milestone alone, so both
     forms name it rather than claiming cards the filter hides. */
  const where = msWhere();
  document.getElementById("flownote").innerHTML = bits.length
    ? bits.join(". ") + `. Every other card${where} belongs to the board below, where the question ` +
      `is what is behind what rather than whose move it is.` + hiddenNote
    : `Nothing${where} is in flight. Every card${where} belongs to the board below.` + hiddenNote;
}

/* With no board data only the banner is drawn, and both card sections, the
   footer and the repository's note are hidden. The first three state facts
   about the tracker. The note sits beside the banner, where a first draw that
   throws after strip() would otherwise leave it next to a banner saying no
   board data is shown. The platform's
   page wrapper makes `hidden` win over a section's own display rule. The strip
   sits outside those sections, so it is emptied: a first live draw that throws
   after strip() has run rolls back to no data, and the strip would otherwise
   keep that draw's count beside a banner saying no board data is shown. The
   subtitle goes back to the page's own for the same reason. */
function render() {
  ["flightsec", "ordersec", "foot", "repnote"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.hidden = NONE;
  });
  /* The selector is drawn only over a board whose state names a milestone
     default, and set on every draw, so a board that stops naming one drops
     it. */
  const bar = document.getElementById("msbar");
  if (bar) bar.hidden = NONE || !("milestoneDefault" in STATE);
  if (NONE) {
    document.getElementById("strip").innerHTML = "";
    document.getElementById("sub").innerHTML = esc(SUBTITLE);
    source(); return;
  }
  readShowAll(); strip(); source(); msbar(); buildOrder(); more(); stamped();
}
adopt(FALLBACK);
render();

/* Draws a complete set of live sections, and rolls back to the last good
   board when the draw throws, so a section that breaks the drawing code keeps
   the board on screen. With no data on screen, a failed first draw goes back
   to drawing none. */
function drawLive(live, had) {
  const last = NONE ? FALLBACK
    : { state: STATE, prs: PRS, working: WORKING, planned: PLANNED,
        next: NEXT, tracker: TRACKER };
  try {
    adopt(live); SOURCE = { live: true }; render(); return true;
  } catch (e) {
    adopt(last);
    SOURCE = { live: false, why: "stopped", had, code: "a live section could not be drawn" };
    try { render(); } catch (e2) { source(); }
    return false;
  }
}

/* A GitHub Action rebuilds board.json beside this page on every change and on
   a schedule, holding the six sections, so the page fetches it on a timer.

   Every section must be present and pass `usableSection`, and a draw that
   throws keeps the last good board. The page tries again on its own, so a
   fetch that fails after a board has drawn keeps that board on screen and says
   when it tries next, and the next good fetch goes live again. A file
   identical to the last one is not drawn again, which keeps a picked card
   picked between fetches, while the banner is still rebuilt so the stale
   warning can appear.

   A first fetch that fails says what a view with no fetch says, because to the
   reader it is the same thing: there is no board here to show. `get` is the
   browser's fetch, and the tests hand it a fake. */
function connectFetch(get) {
  let had = false;
  let lastText = null;
  const failed = code => {
    SOURCE = had ? { live: false, why: "stopped", had, code }
                 : { live: false, why: "none" };
    source();
  };
  /* Polls can overlap, since a slow answer can outlast the two minutes until
     the next one. An answer from an earlier poll than one already handled is
     dropped, whatever it says, so a late success cannot draw over a newer board
     and a late failure cannot mark a live board stopped. A fetch that hangs is
     abandoned after thirty seconds where the browser can time one out. */
  let issued = 0, handled = 0;
  const read = async () => {
    try {
      const signal = typeof AbortSignal !== "undefined" && AbortSignal.timeout
        ? AbortSignal.timeout(30000) : undefined;
      const r = await get(`board.json?t=${Date.now()}`, { cache: "no-store", signal });
      if (!r || !r.ok) return { code: `board.json answered ${r ? r.status : "nothing"}` };
      return { text: await r.text() };
    } catch (e) { return { code: "board.json could not be fetched" }; }
  };
  const poll = async () => {
    const seq = ++issued;
    const got = await read();
    if (seq < handled) return;
    handled = seq;
    if (got.code) return failed(got.code);
    const text = got.text;
    if (had && text === lastText) { SOURCE = { live: true }; source(); return; }
    let d;
    try { d = JSON.parse(text); } catch (e) { return failed("board.json is not JSON"); }
    /* A cache between Pages and the reader can serve a copy older than the
       one on screen. Drawing it would move the board back in time, so the
       newer one stays. */
    if (had && d && d.state && isStr(d.state.updatedAt) &&
        new Date(d.state.updatedAt) < new Date(STATE.updatedAt)) {
      SOURCE = { live: true }; source(); return;
    }
    const gone = SECTIONS.filter(s => !d || d[s] === undefined || d[s] === null);
    if (gone.length) {
      if (had) return failed(`board.json is missing ${andlist(gone)}`);
      SOURCE = { live: false, why: "empty",
                 missing: gone.length === SECTIONS.length ? "" : andlist(gone) };
      return source();
    }
    const bad = SECTIONS.find(s => !usableSection(s, d[s]));
    if (bad) {
      if (had) return failed(`unreadable ${bad}`);
      SOURCE = { live: false, why: "shape", missing: bad };
      return source();
    }
    const live = {};
    SECTIONS.forEach(s => { live[s] = s === "state" ? d[s] : d[s].items; });
    if (drawLive(live, had)) { had = true; lastText = text; }
  };
  poll();
  setInterval(poll, FETCH_EVERY);
}

if (typeof fetch === "function") {
  SOURCE = { live: false, why: "loading" }; source();
  connectFetch((url, opts) => fetch(url, opts));
} else {
  SOURCE = { live: false, why: "none" }; source();
}

/* The stamp ages by the minute, and so can the stale warning over a live
   board, so the banner is rebuilt with it. */
setInterval(() => {
  const el = document.getElementById("stamp");
  if (el && !NONE) el.textContent = "measured " + ago(STATE.updatedAt);
  if (SOURCE.live && !NONE) source();
}, 60000);
</script>

</body></html>
