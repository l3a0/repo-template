<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.ico" sizes="any"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Build board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Prose is set in the sans face and every computed figure in mono, so a count
     or a stamp reads as measured rather than written. */
  :root {
    --ground: #F2F5F7;
    --panel: #FFFFFF;
    --panel-2: #E9EEF2;
    --ink: #17202A;
    --muted: #55636F;
    --faint: #83919E;
    --line: #DCE3E9;
    --rule: #C2CCD6;
    --accent: #2F5D8C;
    --accent-soft: #DEE9F4;
    --exact: #1C6B4B;
    --exact-soft: #D9EDE3;
    --gap: #8E6310;
    --gap-soft: #F6E9CD;
    --wait: #7A4E86;
    --wait-soft: #EDE1F2;
    --far: #8C3A34;
    --far-soft: #F5DEDC;
    --idle: #6E7A85;
    --idle-soft: #E5EAEE;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E141A; --panel: #161D25; --panel-2: #1C242D;
      --ink: #E3EAF1; --muted: #93A1AF; --faint: #74828F; --line: #252E38; --rule: #36414D;
      --accent: #78ADDC; --accent-soft: #14283C;
      --exact: #5DBE93; --exact-soft: #0F2820;
      --gap: #D6A448; --gap-soft: #2F2513;
      --wait: #BD98CC; --wait-soft: #261A2B;
      --far: #DD8880; --far-soft: #2D1715;
      --idle: #8494A2; --idle-soft: #1F272F;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E141A; --panel: #161D25; --panel-2: #1C242D;
    --ink: #E3EAF1; --muted: #93A1AF; --faint: #74828F; --line: #252E38; --rule: #36414D;
    --accent: #78ADDC; --accent-soft: #14283C;
    --exact: #5DBE93; --exact-soft: #0F2820;
    --gap: #D6A448; --gap-soft: #2F2513;
    --wait: #BD98CC; --wait-soft: #261A2B;
    --far: #DD8880; --far-soft: #2D1715;
    --idle: #8494A2; --idle-soft: #1F272F;
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }
  a:focus-visible, [tabindex]:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .mast { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  .mast h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.015em; }
  .mast .sub { color: var(--muted); font-size: 0.875rem; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
  .chip { font-family: var(--mono); font-size: 0.75rem; padding: 5px 10px; border: 1px solid var(--line);
          background: var(--panel); border-radius: 4px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.live { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  /* A repository's own paragraph under the strip, which its caller sets as the
     reusable workflow's `note` input. */
  .repnote { margin: 0 0 4px; font-size: 0.8125rem; color: var(--faint); max-width: 76ch; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .sec { margin-top: 38px; }
  .sec > header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px;
                  border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 16px; }
  .sec h2 { font-size: 0.8125rem; font-family: var(--mono); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); }
  .sec .note { font-size: 0.8125rem; color: var(--faint); }
  .sec .note b { color: var(--muted); font-weight: 600; }



  /* ---- build order: dependency stages ---- */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
  /* A repository that names a data label and has a card carrying it draws a
     fourth column. The narrow widths below list this rule too, so it does not
     outrank them. */
  .board.data { grid-template-columns: repeat(4, 1fr); }
  .col { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .col > .ch { border-top: 2px solid var(--rule); padding-top: 7px; display: flex;
               align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .col > .ch .t { font-family: var(--mono); font-size: 0.75rem; font-weight: 600;
                  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink); }
  .col > .ch .c { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }
  .col > .ch .d { flex-basis: 100%; font-size: 0.6875rem; color: var(--faint); }
  .col.k0 > .ch { border-top-color: var(--exact); }
  .col.k1 > .ch { border-top-color: var(--accent); }
  .col.k2 > .ch { border-top-color: var(--wait); }
  .col.k3 > .ch { border-top-color: var(--far); }
  /* The flow columns are stages rather than depths, so they take their own
     colours: green where the ball is nobody's yet, blue while a session holds
     it, amber while a review is owed, and the accent again when it is the
     owner's move. */
  .col.f-owner > .ch { border-top-color: var(--exact); }
  .col.f-mine > .ch { border-top-color: var(--gap); }
  .col.f-building > .ch { border-top-color: var(--accent); }
  .col.f-planned > .ch { border-top-color: var(--wait); }
  .col .empty { font-size: 0.75rem; color: var(--faint); font-style: italic;
                border: 1px dashed var(--line); border-radius: 6px; padding: 10px; }

  .tk { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 9px;
        background: var(--panel); display: flex; flex-direction: column; gap: 4px;
        cursor: pointer; transition: opacity .12s, border-color .12s; }
  .tk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tk .r1 { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .tk .id { font-family: var(--mono); font-size: 0.75rem; font-weight: 600; }
  .tk .sl { font-family: var(--mono); font-size: 0.625rem; color: var(--faint);
            border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  /* The tracker's own labels, carried across rather than re-invented, because a
     second vocabulary for the same thing is a second thing to keep in step.
     Each takes its colour from the hue GitHub stores for that label, so a
     reader moving between the two surfaces is looking at the same chip. */
  .tk .lbs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tk .lbs b { font-family: var(--mono); font-size: 0.5625rem; font-weight: 600;
               text-transform: uppercase; letter-spacing: 0.06em; border-radius: 3px;
               padding: 1px 5px; border: 1px solid currentColor; }
  .tk .lb { font-size: 0.8125rem; line-height: 1.35; }
  .tk .wo { font-size: 0.6875rem; color: var(--faint); font-family: var(--mono); }
  .tk.k-ready { border-left: 3px solid var(--exact); }
  .tk.k-deferred { border-style: dashed; background: none; }
  .tk.k-deferred .lb, .tk.k-decision .lb, .tk.k-parent .lb { color: var(--muted); }
  .tk.k-decision { border-left: 3px solid var(--gap); }
  .tk.k-data { border-style: dashed; background: none; border-left: 3px solid var(--far); }
  /* A parent that builds nothing takes the idle grey, the same ink the loops'
     column uses for work nothing is owed on. It keeps a solid border, because a
     dashed one already means deferred and a second dashed kind would collapse
     two different reasons into one look. */
  .tk.k-parent { border-left: 3px solid var(--idle); background: none; }
  /* An open pull request is a state of its own, so it colours the three borders
     the kind stripe does not use rather than overwriting the kind stripe. */
  .tk.has-pr { border-top-color: var(--accent); border-right-color: var(--accent);
                border-bottom-color: var(--accent); }
  .tk .pr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 6px;
            font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); }
  /* A card somebody is already on is not a card to pick up. It gets the wait
     colour, which the board already uses for work that is not free to start.
     The stripe is its own mark rather than the pull request's border, because
     a session can be on a card with or without a branch. A
     build session keeps its entry until it hands its pull request over, so a
     card under "Waiting on my review" can carry both. */
  .tk.busy { box-shadow: inset 3px 0 0 0 var(--wait); }
  /* A card whose plan has been executed against the code is a different thing
     from a card whose body is still a hypothesis. The difference is one half
     of whether it can be handed to a builder, and `buildable` in the script
     reads the other half, which is whether a blocker or a reason in `HOLDS`
     keeps the card back. It is
     drawn as a filled corner rather than another border, because the borders
     are spoken for. */
  .tk.plan-build { box-shadow: inset 0 3px 0 0 var(--exact); }
  .tk.plan-decide { box-shadow: inset 0 3px 0 0 var(--gap); }
  .tk .pl { font-family: var(--mono); font-size: 0.6875rem; }
  .tk .pl.build { color: var(--exact); }
  .tk .pl.decide { color: var(--gap); }
  /* Where a card sits in the priority order, as a mark rather than a paragraph.
     Restating the argument here was one surface too many and made a ranked card
     three times the height of its neighbours. A card with no mark is not ranked
     at all, and a deferred one drops its mark rather than showing a number its
     position contradicts. */
  .tk .rk { font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
            color: var(--accent); background: var(--accent-soft);
            border-radius: 3px; padding: 0 5px; }
  .tk .pr .sep { color: var(--rule); }
  .tk .pr .ck.ok { color: var(--exact); }
  .tk .pr .ck.bad { color: var(--far); }
  .tk .pr .ck.run { color: var(--gap); }
  .tk .pr .ck.none { color: var(--faint); }
  .tk .pr .nolink { flex-basis: 100%; color: var(--faint); }
  .board.picking .tk { opacity: .26; }
  .board.picking .tk.on { opacity: 1; border-color: var(--accent); }
  .board.picking .tk.root { opacity: 1; border-color: var(--accent);
                            box-shadow: 0 0 0 2px var(--accent-soft); }

  .chainbar { margin-top: 12px; font-size: 0.75rem; color: var(--muted); display: flex;
              align-items: center; gap: 10px; flex-wrap: wrap; min-height: 1.6em; }
  .chainbar button { font: inherit; font-family: var(--mono); font-size: 0.6875rem;
                     color: var(--accent); background: none; border: 1px solid var(--accent);
                     border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .chainbar .hint { color: var(--faint); }
  /* The line that says how many cards the default view hides, and the button
     that shows them. It borrows the chain bar's button, so it reads as the
     same kind of control. */
  .more { margin-bottom: 14px; font-size: 0.75rem; color: var(--muted); display: flex;
          align-items: center; gap: 10px; flex-wrap: wrap; }
  .more button { font: inherit; font-family: var(--mono); font-size: 0.6875rem;
                 color: var(--accent); background: none; border: 1px solid var(--accent);
                 border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  /* The milestone selector under the strip. It filters both card sections at
     once, so it sits above them rather than in one. */
  .msbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
           margin: 4px 0 12px; font-size: 0.8125rem; color: var(--muted); }
  .msbar label { font-family: var(--mono); font-size: 0.75rem; font-weight: 600;
                 text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink); }
  .msbar select { font: inherit; font-family: var(--mono); font-size: 0.75rem; color: var(--ink);
                  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
                  padding: 4px 8px; max-width: 100%; }
  .msbar .cnt { font-family: var(--mono); font-size: 0.75rem; color: var(--faint); }
  .key { display: flex; flex-wrap: wrap; gap: 9px 16px; margin-top: 12px;
         font-size: 0.75rem; color: var(--muted); align-items: center; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 22px; height: 12px; border-radius: 3px; border: 1px solid var(--line);
           background: var(--panel); flex: none; }
  .key i.ready { border-left: 3px solid var(--exact); }
  .key i.decision { border-left: 3px solid var(--gap); }
  .key i.deferred { border-style: dashed; background: none; }
  .key i.data { border-style: dashed; background: none; border-left: 3px solid var(--far); }
  .key i.parent { border-left: 3px solid var(--idle); background: none; }
  .key i.has-pr { border-top-color: var(--accent); border-right-color: var(--accent);
                   border-bottom-color: var(--accent); }
  .key i.busy { box-shadow: inset 3px 0 0 0 var(--wait); }
  .key i.plan-build { box-shadow: inset 0 3px 0 0 var(--exact); }
  .key i.plan-decide { box-shadow: inset 0 3px 0 0 var(--gap); }
  /* The one swatch that carries a glyph rather than a colour, because the mark
     it stands for is a number and an empty block would not be recognisable as
     the thing on the card. The glyph is a letter rather than a digit on
     purpose. A digit here reads as a position and points at whichever card is
     currently sitting on it. */
  .key i.rk { width: auto; min-width: 22px; height: auto; border: none;
              background: var(--accent-soft); color: var(--accent);
              font-family: var(--mono); font-size: 0.625rem; font-weight: 600;
              font-style: normal; padding: 0 5px; text-align: center; line-height: 1.55; }
  .key i.rk::before { content: "n"; }

  .board.flow { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 1100px) { .board.flow { grid-template-columns: repeat(3, 1fr); } }
  /* The loops' column takes the idle grey, because a card under one is the least
     finished thing the section draws and nothing about it is owed to anybody. */
  .col.f-planning > .ch { border-top-color: var(--idle); }
  @media (max-width: 900px) { .board, .board.data { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .board, .board.data { grid-template-columns: 1fr; } }

  .caveat { margin-top: 18px; border-left: 3px solid var(--accent); background: var(--panel);
            border-radius: 0 5px 5px 0; padding: 12px 15px; font-size: 0.8125rem; color: var(--muted); }
  .caveat b { color: var(--ink); font-weight: 600; }
  .caveat + .caveat { margin-top: 10px; }
  .caveat.warn { border-left-color: var(--gap); }

  footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line);
           font-size: 0.75rem; color: var(--faint); }
  footer p { margin: 0 0 8px; max-width: 76ch; }
  footer p:last-child { margin-bottom: 0; }
  footer b { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <div class="mast">
    <h1 id="title">Build board</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="msbar" id="msbar" hidden><label for="mssel">Milestone</label><select id="mssel"></select>
    <span class="cnt" id="mscount"></span></div>
  <div class="caveat warn" id="source" hidden></div>
  <p class="repnote" id="repnote" hidden></p>

  <section class="sec" id="flightsec">
    <header>
      <h2>In flight</h2>
      <span class="note">the five states between a plan being written and a merge, <b>most finished
        on the left</b>. A card here is somebody's already, and the column says whose move it is.</span>
    </header>
    <div class="board flow" id="flow"></div>
    <div class="chainbar" id="flowchain"></div>
    <div class="key" id="flowkey"></div>
    <div class="caveat" id="flownote"></div>
  </section>

  <section class="sec" id="ordersec">
    <header>
      <h2>Build order</h2>
      <span class="note" id="ordernote"></span>
    </header>
    <div class="more" id="more"></div>
    <div class="board" id="board"></div>
    <div class="chainbar" id="chainbar"></div>
    <div class="key" id="key"></div>
    <div class="caveat" id="boardnote"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* The issue and pull request links, built from the repository the board names
   once a board arrives. Many repositories serve this one page, so it names none
   of its own. */
let ISS = "", PRU = "";

/* Provenance: ported from .claude/skills/update-build-board/board.html in
   l3a0/quantitative-trading at commit 6da0ee3, landed here by the pull request
   that closes l3a0/repo-template#24. On the way the page stopped naming a
   repository, reading its links and title from the board instead, the
   "Waiting on data" column and its kind were cut, the Show all choice was
   keyed by repository, and comments recording that repository's history were
   cut or restated as the rules they record. The pull request that closes
   l3a0/repo-template#40 brought the column back for a board whose tracker
   holds a card of the kind `data`, which only a repository naming a data
   label to the reusable workflow gets. The pull request that closes
   l3a0/repo-template#45 added the milestone selector, which only a board
   whose state carries `milestoneDefault` draws.

   The board's data is one file, board.json, beside this page on GitHub Pages.
   The reusable workflow .github/workflows/build-board.yml in
   l3a0/repo-template rebuilds it from GitHub on every issue, comment and pull
   request change and on a schedule, by running scripts/build_board.py. No
   session writes it. A session sets the labels, links and marker lines the
   script reads, and the update-build-board skill in the l3a0 plugin says
   which.

   The file holds six sections, state, prs, working, planned, next and tracker.
   Each is { schema: 1, items: [...] }, except state, which is
   { schema: 1, repo, title, updatedAt, issues: { open }, source,
   longestGapMinutes, staleAfterMinutes }, plus subtitle, note and main when
   the caller sets the reusable workflow's subtitle, note and
   default-branch-head inputs, and milestoneDefault when the repository names
   a milestone default.

   FALLBACK carries no board data. A copy of the six sections in the page goes
   stale silently, because nothing refreshes it once the page is checked in.
   So until the file arrives, or when it cannot be fetched, the page draws
   only the banner under the strip, which says why there is nothing to show. */
const SECTIONS = ["state", "prs", "working", "planned", "next", "tracker"];
/* How often the board on GitHub Pages fetches board.json again. Pages tells a
   browser to cache the file for ten minutes, so each fetch asks for a URL no
   cache has seen and tells the browser to store nothing. */
const FETCH_EVERY = 120000;
const FALLBACK = { none: true };
/* True while there is no board to draw. Every section states facts about the
   tracker, so the page draws nothing but the banner until it has data. */
let NONE = true;

let STATE, PRS, WORKING, PLANNED, NEXT, TRACKER, NEXT_SORTED;
let SOURCE = { live: false, why: "loading" };

/* What each section must hold before the page adopts it. A document that fails
   leaves the last good copy of that section on screen rather than drawing a
   board from half a write.

   The check reaches inside the items and the state's figures, not only the
   outer shape. Its first version looked at the shape alone, and a review of
   the migration showed what that cost: a tracker item with no `needs` passed,
   crashed the redraw, and left a new strip above the old board with no banner.
   Every field the renderer dereferences without a guard is checked here. A
   field it already treats as optional, such as a pull request's `rollup` or a
   card's `after`, is left alone, because refusing it would refuse a document
   the page draws correctly. `render` is also wrapped where it is called, so a
   shape this misses still lands on the banner rather than on a half-drawn
   board. */
const isNum = v => typeof v === "number" && isFinite(v);
const isStr = v => typeof v === "string";
/* An owner and a name, as GitHub spells them. The repository lands in every
   link's address, so anything else is refused rather than escaped. */
const REPO_NAME = /^[A-Za-z0-9-]+\/[A-Za-z0-9._-]+$/;
const ITEM_OK = {
  prs: p => p && isNum(p.pr) && isNum(p.issue) && isStr(p.state),
  working: w => w && isNum(w.n),
  planned: p => p && isNum(p.n) && isNum(p.passes) && isStr(p.ready),
  next: x => x && isNum(x.issue) && isNum(x.band) && isStr(x.ready),
  tracker: c => c && isNum(c.n) && isStr(c.ms) && isStr(c.label) && isStr(c.kind) &&
    Array.isArray(c.needs) && Array.isArray(c.labels)
};
function usableSection(name, d) {
  if (!d || d.schema !== 1) return false;
  if (name === "state") {
    return isStr(d.updatedAt) && !!d.issues && isNum(d.issues.open) &&
      isStr(d.repo) && REPO_NAME.test(d.repo);
  }
  if (!Array.isArray(d.items) || !d.items.every(ITEM_OK[name])) return false;
  return name === "tracker" ? d.items.length > 0 : true;
}

/* A delivered snapshot is frozen, so the page works on a clone. */
function adopt(src) {
  NONE = !!src.none; /* only FALLBACK carries it */
  if (NONE) return;
  const d = JSON.parse(JSON.stringify(src));
  STATE = d.state; PRS = d.prs; WORKING = d.working; PLANNED = d.planned;
  NEXT = d.next; TRACKER = d.tracker;
  ISS = `https://github.com/${STATE.repo}/issues/`;
  PRU = `https://github.com/${STATE.repo}/pull/`;
  NEXT_SORTED = NEXT.slice().sort((a, b) =>
    a.band - b.band ||
    (a.order ?? 50) - (b.order ?? 50) ||
    READY_RANK[a.ready] - READY_RANK[b.ready] ||
    a.issue - b.issue);
}

/* What the banner says over a live board, which is nothing unless the board
   is stale.

   The stale warning exists because a failed run leaves the last board up, and
   a board hours stale looks like a fresh one. The stamp already says its
   age, and a stamp nobody reads alarms nobody. The threshold comes from the
   board rather than from this page, because the generator reads it from the
   workflow's schedule, and a second copy written here would drift the first
   time the schedule changed.

   The threshold is the longest gap between two scheduled runs plus an
   allowance for a run GitHub starts late or drops, so the banner names the
   gap rather than promising a rebuild by any time. GitHub documents no bound
   on the delay. Twice the gap would call a healthy board stale whenever one
   run came an hour late in a quiet stretch, and an allowance of an hour called
   a healthy board stale 45% of the time once the schedule fired in about 11%
   of its slots. */
function liveNotes() {
  const s = STATE || {};
  const out = [];
  if (isNum(s.staleAfterMinutes)) {
    const age = (Date.now() - new Date(s.updatedAt).getTime()) / 60000;
    const due = isNum(s.longestGapMinutes)
      ? `Scheduled rebuilds are due at most ${s.longestGapMinutes} minutes apart, ` +
        `and it is older than that plus an allowance for GitHub starting one late or dropping it, ` +
        `so the Action that rebuilds it may be failing.`
      : `The Action that rebuilds it may be failing.`;
    if (age > s.staleAfterMinutes) out.push(
      `<b>This board may be stale.</b> It was built from GitHub ${esc(ago(s.updatedAt))}. ` + due);
  }
  return out;
}

/* The banner is empty while the page shows live data, apart from the notes
   above, and says what it is showing otherwise. */
function source() {
  const el = document.getElementById("source");
  if (!el) return;
  if (SOURCE.live) {
    const notes = liveNotes();
    el.hidden = !notes.length; el.innerHTML = notes.join(" "); return;
  }
  /* A function, because STATE is unset while the page has no data. Only the
     stopped line with a board on screen reads it.

     A page that is not live has no board on screen unless it drew one and then
     stopped, because nothing else puts data on it. The page once carried a copy
     of the board, and later a copy spliced in for the update-build-board
     skill's harness, and the
     lines here said which copy was showing and how old it was. The harness now
     serves a board.json through a fake fetch instead, so every other line says
     there is no board data and that the page carries no copy. */
  const age = () => `measured ${esc(ago(STATE.updatedAt))}` +
    (headOf(STATE) ? ` against <span class="mono">${esc(headOf(STATE))}</span>` : ``);
  const none = `<b>Showing no board data.</b> `;
  const lines = {
    loading: none + `The live board has not arrived yet, and the page carries no copy of its own.`,
    none: none + `This view cannot reach the live board, and the page carries no copy of its own.`,
    empty: none + (SOURCE.missing
      ? `The live board is missing ${esc(SOURCE.missing)}.`
      : `The live board holds no section yet.`),
    shape: none + `The live board's ${esc(SOURCE.missing || "")} section is missing fields this page needs, so it was not used.`,
    /* The page retries on its own timer, so it says so rather than asking for
       a reload. */
    stopped: `<b>Live updates stopped${SOURCE.code ? ` (${esc(SOURCE.code)})` : ""}.</b> ` +
      (SOURCE.had ? `What is shown is the last live data, ${age()}. ` +
                    `The page tries again every ${FETCH_EVERY / 60000} minutes.`
                  : `Showing no board data.`)
  };
  el.innerHTML = lines[SOURCE.why] || lines.none;
  el.hidden = false;
}

/* The strip carries two things: the open issue count and the stamp. A figure
   about the repository itself, such as a test count or the commit `main`
   stands at, says nothing about what to take next, which is the question this
   page answers, and measuring one goes stale the moment anything merges. The
   strip still leaves that commit out. The footer and the "Live updates
   stopped" banner name it only for a caller that sets default-branch-head, as
   a record of what the board was built against. */

/* One entry per open branch, plus a merged or closed one while its issue stays
   open, because the card still says what became of it. The generator keeps
   both kinds, finding the merged and closed ones through each open issue's
   links. The array is the whole account of the pull requests
   against open issues, so this comment carries the rules for reading it rather
   than a sentence naming today's branches, which would outlive them in the
   one place a reader cannot see it render.

   A rollup is read against a branch's current head rather than the commit it
   opened on, because it is a claim about one merge ref at one moment and a
   review's fixes move the head. A check that has not concluded is carried as
   running rather than folded into either verdict. GitHub reports it with a null
   conclusion, and a filter asking whether the conclusion is success calls that
   a failure, which has twice nearly put a red word on a branch nothing was
   wrong with.

   `reviewed` is the only flag here that no query answers on its own. GitHub's
   own review decision stays at "review required" whatever a session posts,
   because a session comments rather than approving, so a review that has
   landed and a review nobody has written look identical to the API. Counting
   the comments that open with a review heading is what separates them, and a
   card cannot leave the column saying the next move is mine without it.

   A branch that closes no issue gets no card at all, because the board is
   built from the tracker. That happened once, and the fix was to file the
   issue rather than to give the page a second source of truth.

   `linked` is GitHub's own closingIssuesReferences to an issue in this
   repository. The Action writes an entry only for an issue GitHub links or a
   `Part of` reference names, so `linked` is false exactly when `partOf` is
   true, and the page does not read it. A closing keyword written inside a code span, where GitHub does not read
   it, gives the branch no entry at all, and
   `gh pr view <n> --json closingIssuesReferences` remains the check on a body.

   One branch closing two issues takes one entry per issue, because the map
   that feeds the cards is keyed by issue and a single entry would leave the
   other card showing no branch at all. */

/* Cards a session is already working, which the key's five states do not cover.
   An empty array reads as no information rather than as nobody working. Only a
   running session can add an entry, and only whoever added one can take it out,
   so the entries are the one part of this page that sessions maintain by hand,
   as `working:` labels. The update-build-board skill's
   hand-over moment is the one that takes a
   build session's label off. An entry shapes three columns: the two session columns,
   and "Waiting on my review", where it holds a branch its session has not handed
   over.

   This is the most perishable thing on the page. A pull request survives until
   it merges and can be re-read at any time, while a running session ends
   without telling anyone, so this list is right at the stamp above and decays
   from there rather than going stale all at once. It is worth carrying anyway,
   because the cost it avoids is two sessions doing one card, which is paid in
   full and discovered late.

   `kind` is "build" where the session will end in a branch, and a decompose
   loop either says so or leaves it out. It is read rather than decorative: a
   build session suppresses the plan marker on its card and a decompose loop
   does not, because one is carrying the plan out and the other is still
   writing it.

   An entry stays after its pull request opens, until the session hands the
   branch over, and it comes out in the same write that records the hand-over.
   It used to come out when the pull request opened, which let a reviewed and
   green branch read as the owner's while its session was still pushing to it.
   `handedOver` carries that measurement. */
/* Cards whose plan has been run against the code rather than only written.

   A decompose loop audits an issue against the repository, corrects the body so
   the next reader gets the correction instead of the next message, and exits
   when a pass stops reducing the body. An exit rule asking for two consecutive
   passes that find nothing cannot terminate, because the loop edits the body
   and those edits produce findings. What the loop leaves is a plan somebody has
   executed, which is the difference between a card a builder can take and a
   card that is still a guess.

   `ready` is what the card can actually be handed to:

   - "build" means nothing is in the way.
   - "decide" means the plan is finished and one question is the owner's.

   A card absent from this list is not a bad card. It is a card whose body has
   never been executed against the code, and that is unknown rather than fine.
   Read a pass count as a cost rather than as a depth. A loop's later passes
   often find drift its own earlier passes wrote into the body. */
/* Ranked on four axes, and the page sorts them rather than carrying a hand
   ordering that nobody can check.

   1. `band` is priority under the repository's ranking directive, and the
      repository says what each band means. A lower band lands first.
   2. `order` breaks a tie inside a band, and it exists only where something was
      measured. A card with no order counts as 50, so an order of 0 or below
      sorts ahead of it and anything above 50 sorts behind it.
   3. `ready` is how finished the plan is. "build" means a decompose loop ran it
      against the code and exited. "decide" means the same, with one question
      left for the owner. "plan" means the body has never been executed against
      anything.
   4. The issue number breaks whatever is left, because it is stable.

   Most of the tracker carries no position, which is the design rather than an
   omission: the ranking covers the top, and a card it gives no order sorts at
   50 inside its band. A position invented to fill the page would be a number
   nobody measured. */

const READY_RANK = { build: 0, decide: 1, plan: 2 };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const plu = (n, w) => n + " " + w + (n === 1 ? "" : /(s|x|ch|sh)$/.test(w) ? "es" : "s");
/* One join, two conjunctions. A set of things that all hold takes "and", and a
   set of alternatives takes "or". The reasons a card is not free are
   alternatives, and reading them joined by "and" said one card needed a
   decision and was deferred at the same time. */
const joinwith = (w, xs) => xs.length < 2 ? (xs[0] || "")
  : xs.slice(0, -1).join(", ") + " " + w + " " + xs[xs.length - 1];
const andlist = xs => joinwith("and", xs);
const orlist = xs => joinwith("or", xs);

/* A rollup is folded to the worst thing in it, because a board reader deciding
   whether a branch is ready needs the blocker rather than the tally. An entry
   still running and an empty rollup each read as themselves rather than as a
   pass, so nothing unfinished is drawn as green.

   Only `success` is green. This used to count `failure`, `running` and
   `neutral` and call every other word a pass, so GitHub's own uppercase
   `FAILURE` or `TIMED_OUT`, passed through as they come, read as green. The
   generator behind the board on GitHub Pages maps every state into the four
   words, and a word this page does not know now reads as reported neither way,
   so the next state GitHub adds cannot arrive here as a pass. */
function checkword(rollup) {
  const c = k => (rollup || []).filter(([, s]) => s === k).length;
  if (!rollup || !rollup.length) return ["none", "no checks reported"];
  const bad = c("failure"), run = c("running");
  const odd = rollup.length - bad - run - c("success");
  if (bad) return ["bad", plu(bad, "check") + " failing" +
    (run ? ", " + plu(run, "check") + " still running" : "")];
  if (run) return ["run", plu(run, "check") + " still running"];
  if (odd) return ["none", plu(odd, "check") + " reported neither way"];
  return ["ok", "checks green"];
}

/* A stamp ahead of the reader's clock is reported rather than rounded away.
   Every branch below rounds a negative age up into "just now", so a page stamped
   into the future says it was measured just now and goes on saying it however
   stale it gets. That is the one sentence this page exists to get right, since
   it is the only warning a reader has that nothing here refreshes itself, and it
   failed silently in the direction that reads as healthy.

   It is not hypothetical and not one session's slip. Two consecutive published
   versions carried it, stamped 20:22Z and 21:52Z against a clock reading 19:26Z,
   and both read "measured just now" while live. Two minutes of slack absorbs
   ordinary skew between the machine that measured and the machine reading. */
function ago(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms)) return "";
  const m = Math.round(ms / 60000);
  if (m < -2) return "at a stamp ahead of this clock, so its age cannot be read";
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

/* The lines a caller can set through the reusable workflow's inputs. Each is
   drawn on every draw, from the board when it carries the line and from the
   page otherwise, so a later board without one puts the page's own back.
   SUBTITLE is the only copy of the page's own subtitle. The markup's span is
   empty, and render() fills it while no board is drawn. */
const SUBTITLE = "what is in flight, and what to take next";
/* A note is a list of pieces the generator parsed from the caller's text, each
   { text } or { text, href }. The page escapes each piece and draws an address
   as a link only when it is https, which the generator also checked, so
   neither half alone decides what lands in an href. A note in any other shape
   is left out rather than refusing the state section, because the note says
   nothing about the tracker. */
const NOTE_HREF = /^https:\/\/[^\s"<>]+$/;
function noteHtml(note) {
  if (!Array.isArray(note) || !note.every(p => p && isStr(p.text))) return "";
  return note.map(p => isStr(p.href) && NOTE_HREF.test(p.href)
    ? `<a href="${esc(p.href)}" target="_blank" rel="noopener">${esc(p.text)}</a>`
    : esc(p.text)).join("");
}
/* The first seven characters of the default branch's head, which the
   generator writes only for a caller that sets default-branch-head, or "". */
const headOf = s => s && isStr(s.main) && /^[0-9a-f]{7}$/.test(s.main) ? s.main : "";

function strip() {
  const s = STATE;
  /* The title, the subtitle and the note are the lines of the heading that come
     from the board. An older board with none keeps the page's own title and
     subtitle and draws no note. */
  const title = isStr(s.title) && s.title ? s.title : "Build board";
  document.getElementById("title").innerHTML = esc(title);
  document.title = title;
  document.getElementById("sub").innerHTML =
    esc(isStr(s.subtitle) && s.subtitle ? s.subtitle : SUBTITLE);
  const note = document.getElementById("repnote");
  note.innerHTML = noteHtml(s.note);
  note.hidden = !note.innerHTML;
  document.getElementById("strip").innerHTML = [
    `<span class="chip"><b>${s.issues.open}</b> open issues</span>`,
    `<span class="chip live" id="stamp">measured ${esc(ago(s.updatedAt))}</span>`
  ].join("");
}

/* All that is left of a twenty-paragraph footer. The narrative was a second
   telling of what the cards already say, and it went. This sentence did not,
   because the page has no way to refresh itself and a page that does not say so
   reads as live. */
function stamped() {
  /* The decay warning names the states that can actually decay, rather than
     listing every one of them whenever any is present. A review posted since
     the stamp can only be misread as owed while some open branch is still
     unreviewed, so that clause is dropped once none is. Otherwise the page
     warns about a staleness no card on it can have, a sentence outliving its
     data in a smaller form.

     A running session decays faster than either of the other two, and it was
     the one this list did not name. The list was built from `PRS` alone, so
     four sessions under the Building column and no branch open drew no warning
     at all. `WORKING` has carried the reason in its own comment since it was
     written, that a session ends without telling anyone, and a comment renders
     nowhere. This is the surface that says what the page cannot know, so the
     sentence belongs here. */
  /* Under one milestone the In flight section draws that milestone alone, so
     the warning reads only its pull requests and sessions. */
  const byN = new Map(TRACKER.map(c => [c.n, c]));
  const shown = n => inMs(byN.get(n));
  const open = PRS.filter(p => p.state === "open" && shown(p.issue));
  const working = WORKING.filter(w => shown(w.n));
  const decay = [];
  if (working.length) decay.push("a session that has ended since then still reads as running");
  if (open.length) decay.push("a check that has gone green or red since then still reads here as it read then");
  if (open.some(p => !p.reviewed)) decay.push("a review posted since then still reads as owed");
  /* The board is no longer measured by hand, so the footer says how it is
     built. Its figures still date from the stamp rather than from the moment of
     reading, so the decay clause still holds. */
  const head = headOf(STATE)
    ? ` against the default branch at <span class="mono">${esc(headOf(STATE))}</span>` : ``;
  const how = `Built from GitHub${head} by an Action on each change and on a schedule, and ` +
    `fetched again every ${FETCH_EVERY / 60000} minutes`;
  document.getElementById("foot").innerHTML =
    `<p>${how}, so every figure on it is current as of the stamp above rather than live.` +
    (decay.length ? ` The In flight section decays fastest: ${andlist(decay)}.` : ``) +
    `</p>`;
}

/* ---- the tracker, as a dependency graph ----

   Horizontal position is dependency depth and nothing else. It says what must
   clear before a card can start, never when anything will happen, and every
   card is the same width so no length reads as a duration.

   `kind` is orthogonal to depth. A card can be startable today and still be
   something nobody should start: deferred under the ranking rule, or a decision
   that needs the owner rather than a session. Collapsing the two would put
   a card waiting on the owner beside a card a session can take. */
const COLS = [
  ["Ready now", "nothing open blocks these"],
  /* Steps along a chain rather than things to land. "Behind one" over "one
     thing has to land first" reads as a count of blockers, which goes false the
     first time a card in this column waits on two issues. */
  ["One step behind", "what these wait on waits on no open issue"],
  ["Two steps behind or more", "something these wait on waits on another"],
  /* Drawn only when the tracker holds a card of this kind, so a repository
     that names no data label keeps three columns. A purchase is not work a
     session can do, so these cards sit outside the chain the depth sentence
     measures. */
  ["Waiting on data", "not a backlog, a purchase"]
];
/* One colour per tracker label, so the page and GitHub show the same chip.
   Two diverge on purpose, and the rule is readability rather than fidelity: a
   label colour on GitHub is a chip background, while here it is text. GitHub's
   `enhancement` is `a2eeef` and its `deferred` is `ededed`, both too pale to
   read as text on white, so each is darkened here. `question` is the third and
   newest of them: GitHub stores `d876e3`, which reaches 2.3 to 1 against white
   and is darkened here to 5.6 to 1. A label with no entry falls back to the
   faint ink rather than being dropped, because a new label is information and a
   missing colour is not a reason to hide it. The entries are the kind and
   work labels the template's .github/labels.json creates, and
   `blocked-on-data`, the data label the reusable workflow's input names as its
   example. */
const LABEL_HUE = {
  bug: "#d73a4a", documentation: "#0075ca", enhancement: "#2F7F86",
  test: "#5319e7", deferred: "#6E7A85", question: "#9B3BA8", decision: "#8A5A00",
  "blocked-on-data": "#B60205"
};

/* A parent is a kind of its own. An issue split into sub-issues builds nothing
   itself and keeps only the rules its children obey. That is neither work, nor
   deferred, nor a decision, and calling it any of those puts a card in the
   first column reading as something a session can take.
   The word is on the card because the depth graph cannot say it: nothing blocks
   a parent, so depth alone would call it free. */
const KINDWORD = { ready: "", decision: "needs a decision, not a session",
                   deferred: "deferred on purpose",
                   parent: "a parent, which builds nothing itself" };
/* The same two facts as a sentence, for the card's label. They are not the same
   string because the visible line is a fragment under a card and the label is
   read aloud in sequence, so it needs a subject and a verb. Prefixing "It " to
   `KINDWORD` gave "It deferred on purpose", which is what happens when one
   phrase is reused in two grammars. This sits beside `KINDWORD` rather than in
   the template so the pair moves together when a kind is added. */
const KINDSAYS = { ready: "", decision: "It needs a decision, not a session.",
                   deferred: "It is deferred on purpose.",
                   parent: "It is a parent, and builds nothing itself." };

let CHAIN_ESC = null;

/* The build order shows only the cards in the priority order unless the reader
   asks for the rest. With every open issue drawn, the first column ran past
   fifty cards and the ten that `NEXT` ranks were scattered through it. The
   choice is remembered per browser and nowhere else, and the default is the
   short view. */
let SHOW_ALL = false;
/* Read once the first board names its repository. Every board an owner
   publishes shares one origin, such as owner.github.io, and so one storage, so
   the key carries the repository or one board's choice would flip another's. */
let SHOW_ALL_READ = false;
const showAllKey = () => "board-all:" + STATE.repo;
function readShowAll() {
  if (SHOW_ALL_READ) return;
  SHOW_ALL_READ = true;
  try { SHOW_ALL = localStorage.getItem(showAllKey()) === "1"; } catch (e) { SHOW_ALL = false; }
}
let SHOWN = 0, HIDDEN = 0, SHOWN_RANKED = 0;

/* The milestone selector. A repository that works toward one milestone at a
   time names a milestone default to the reusable workflow, and the generator
   resolves it to a milestone and writes it as `state.milestoneDefault`, null
   when nothing matches. The selector is drawn exactly when that key is
   present, so a board that names none draws what it drew before.

   MS_PREF is what the reader chose, kept per browser under a key naming the
   repository, as the Show all choice is. MS is what the page draws. It falls
   back to the default whenever the choice names a milestone no open card
   carries, without forgetting the choice, so a stored milestone comes back if
   a card returns to it. The All option's value carries a comma, which no
   milestone's short name can, so a milestone titled "All" cannot collide
   with it. The empty name is a card with no milestone.

   The filter decides only what is drawn. Depth, blockers, the chain walk,
   the In flight split, the strip and the footer still read the whole board,
   so a card keeps its column and its "waits on" line when its blocker sits
   in another milestone. */
const MS_ALL = ",all";
let MS = MS_ALL, MS_PREF = null, MS_READ = false, MS_OPTS = "";
const msKey = () => "board-ms:" + STATE.repo;
function readMs() {
  if (MS_READ) return;
  MS_READ = true;
  try { MS_PREF = localStorage.getItem(msKey()); } catch (e) { MS_PREF = null; }
}
const inMs = c => MS === MS_ALL || (!!c && c.ms === MS);
const msName = ms => ms === "" ? "no milestone" : ms;
/* The words a sentence adds when it is about the chosen milestone only. */
const msWhere = () => MS === MS_ALL ? "" : MS === "" ? " with no milestone" : ` in ${esc(MS)}`;

/* Resolves MS and draws the selector. `render()` runs it before the cards,
   because every section reads MS. The options are rebuilt only when the set
   of milestones changes, so a live redraw does not close a select the reader
   has open. */
function msbar() {
  const sel = document.getElementById("mssel");
  const cnt = document.getElementById("mscount");
  if (!("milestoneDefault" in STATE)) {
    MS = MS_ALL; MS_OPTS = "";
    if (sel) { sel.innerHTML = ""; sel.onchange = null; }
    if (cnt) cnt.innerHTML = "";
    return;
  }
  readMs();
  const counts = new Map();
  TRACKER.forEach(c => counts.set(c.ms, (counts.get(c.ms) || 0) + 1));
  const names = [...counts.keys()].sort((a, b) =>
    (a === "") - (b === "") || String(a).localeCompare(String(b)));
  const def = STATE.milestoneDefault;
  MS = MS_PREF === MS_ALL || (isStr(MS_PREF) && counts.has(MS_PREF)) ? MS_PREF
    : isStr(def) && counts.has(def) ? def : MS_ALL;
  const shown = MS === MS_ALL ? TRACKER.length : counts.get(MS);
  if (sel) {
    const opts = [[MS_ALL, "All", TRACKER.length], ...names.map(n => [n, msName(n), counts.get(n)])]
      .map(([v, w, k]) => `<option value="${esc(v)}">${esc(w)} (${k})</option>`).join("");
    if (opts !== MS_OPTS) { sel.innerHTML = opts; MS_OPTS = opts; }
    sel.value = MS;
    sel.onchange = () => {
      MS_PREF = sel.value;
      try { localStorage.setItem(msKey(), MS_PREF); } catch (err) { /* per-browser only */ }
      render();
    };
  }
  if (cnt) cnt.innerHTML = `${shown} of ${TRACKER.length} open`;
}

/* The button sits above the board, so it shows before the reader scrolls past
   every card. */
function more() {
  const el = document.getElementById("more");
  if (!el) return;
  if (!HIDDEN && !SHOW_ALL) { el.innerHTML = ""; return; }
  /* Both counts are within the chosen milestone, so the line says so. A parent
     shown beside the ranked cards under one milestone is not one of them, so
     it is counted apart. */
  const where = msWhere();
  const parents = SHOWN - SHOWN_RANKED;
  el.innerHTML = SHOW_ALL
    ? `<span>Showing all ${SHOWN} open issues${where} not in flight.</span>` +
      `<button type="button" data-toggle>Show only the ranked cards</button>`
    : `<span>Showing the ${SHOWN_RANKED} ranked ${SHOWN_RANKED === 1 ? "card" : "cards"}` +
      `${parents ? ` and ${plu(parents, "parent")}` : ""}${where}. ` +
      `${HIDDEN} other open ${HIDDEN === 1 ? "issue" : "issues"}${where} ` +
      `${HIDDEN === 1 ? "is" : "are"} not in the priority order.</span>` +
      `<button type="button" data-toggle>Show all ${SHOWN + HIDDEN}</button>`;
  el.onclick = e => {
    if (!e.target.matches("[data-toggle]")) return;
    SHOW_ALL = !SHOW_ALL;
    try { localStorage.setItem(showAllKey(), SHOW_ALL ? "1" : "0"); } catch (err) { /* per-browser only */ }
    render();
  };
}

function buildOrder() {
  const by = new Map(TRACKER.map(c => [c.n, c]));
  /* The ranking is not a section of its own, which would list the same cards
     a second time. A card carries its position as a chip, and the link to its
     issue, where the reasoning for the position lives. */
  const rankWhy = new Map(NEXT_SORTED.map(it => [it.issue, it]));
  const rankPos = new Map(NEXT_SORTED.map((it, i) => [it.issue, i]));
  const planOf = new Map(PLANNED.map(x => [x.n, x]));
  const workOn = new Map(WORKING.map(w => [w.n, w]));
  /* Grouped rather than keyed one-to-one, because two pull requests can be open
     against one issue and a Map would keep only the last. That case is the one
     a board reader most needs, since merge order decides which lands and
     neither body can know it. */
  const prOf = new Map();
  PRS.forEach(p => {
    if (!prOf.has(p.issue)) prOf.set(p.issue, []);
    prOf.get(p.issue).push(p);
  });

  /* One expression decides whether a card shows a plan marker, and both the card
     and the legend call it. Two expressions encoding one rule agree only until a
     change reaches one and not the other. That is one rule written twice
     rather than anything about render against data: the data is the source of
     truth, and the marker is a function of the
     data plus one suppression rule, so the only safe arrangement is that the
     rule exists once.

     What the rule says is that the marker reports a finished plan nobody is
     carrying out yet, and it goes the moment somebody is. Whether the card can
     be handed to a builder is a separate question, which `takeable` and
     `HOLDS` answer. `buildable` below asks it for the marker's suffix, its
     label sentence and the legend's gloss, so none of the three offers the
     card to a builder while the notes and the chain bar hold it back. A marker
     that answered that question itself let a deferred card read "deferred on
     purpose" above "ready to build".

     A branch carries the plan out. So does a build session, which is the same
     handover an hour earlier and was leaving the card saying it was ready to
     build directly above a line saying somebody was building it. A decompose
     loop does not, because it revises the plan rather than carrying it out, so
     a card under one keeps its marker. An
     entry with no kind is a decompose loop, which is the default this array has
     always carried. Only an open pull request is a branch. A merged `Part of`
     leaves the rest of its issue for a builder, and a closed one carried
     nothing out, so neither hides the marker. A merged one with no `Part of`
     was meant to close its issue, so nothing is left for a builder and only
     the close by hand remains, which `handClose` says. */
  const branched = c => openBranches(prOf, c.n).length > 0;
  const handClose = c => closesByHand(prOf, c.n);
  const carriedOut = c => branched(c) || handClose(c) || (workOn.get(c.n) || {}).kind === "build";
  const planMarker = c => carriedOut(c) ? null : (planOf.get(c.n) || null);
  /* Whether a card draws its kind word. An open pull request hides it, because
     a card saying it needs a decision, under a branch that already made one, is
     two answers to one question. A merged one with no `Part of` hides it for
     the same reason, since only the close by hand is left. `card()` asks this
     for the word and for the sentence its label reads, and `HOLDS` asks it
     before giving a kind as a reason, so the bar cannot give a reason the card
     itself withholds. The note's reasons once skipped this, and a decision
     card whose pull request merged with no `Part of` made the note say a card
     "can need a decision" while no card in the column said so. */
  const kindShown = c => !branched(c) && !handClose(c);
  /* One table says why a card is not free for a session to take, and the test
     for a free card is ordinary work that no row of it holds. The board note's
     free list, the chain bar and the In flight note's planned sentence all read
     them, and so does `buildable`, which decides the plan marker's "ready to
     build" and the legend's gloss for it. The bar used to read only `needs`,
     so a card with none either way was called free to take on its own
     whatever its kind word, its session, its branch or its plan said. That is
     the free list and the bar giving two answers to one question.

     Each reason carries two forms. The board note says what a card can be,
     across several cards, so it takes the bare verb. The bar says what one
     card is, so it takes the third person. They sit side by side so the pair
     moves together when a reason is added, as `KINDWORD` and `KINDSAYS` do.

     Anything already carried is subtracted, not only a session, and a loop
     counts as much as a build. An open pull request says the work is written,
     which is a stronger reason not to start it than a session that may still
     end in nothing. A merged `Part of` says nothing of the kind, because its
     issue is open for the part it did not do, and a closed one did nothing, so
     either card is as free as one no branch ever touched. A merged one with no
     `Part of` is held, because its work has landed and only a close by hand is
     left. Reading the bare `prOf` entry instead holds a card back as waiting on
     a review after its `Part of` has merged. The two "Waiting on" columns take
     every card with an open branch, so the free list never meets one. The
     chain bar does, because a card in flight can be picked, and the row also
     stops a change to `FLOW` putting a written card back in the free list,
     which would count one card twice.

     A plan whose one open question is the owner's holds its card the way the
     In flight note says, in the same words. It reads `planMarker`, so it fires
     only where the card draws "waits on an owner call". A card with a session
     on it is held for that already, and its marker says the plan is being
     re-measured instead. The free list never meets this row either, because a
     planned card in the first column is one held for a close by hand, which
     draws no marker. The In flight note does, under "Planned, no builder",
     where it gives this row's words for a card waiting on the owner. */
  const HOLDS = [
    { held: c => kindShown(c) && c.kind === "decision",
      can: "need a decision rather than a session", is: "needs a decision rather than a session" },
    { held: c => kindShown(c) && c.kind === "deferred",
      can: "be deferred on purpose", is: "is deferred on purpose" },
    { held: c => kindShown(c) && c.kind === "parent",
      can: "be a parent whose children carry the work", is: "is a parent whose children carry the work" },
    { held: c => workOn.has(c.n),
      can: "already have somebody on it", is: "already has somebody on it" },
    { held: branched,
      can: "already be written and waiting on a review", is: "is already written and waiting on a review" },
    { held: handClose,
      can: "have merged and need only closing by hand", is: "has merged and needs only closing by hand" },
    { held: c => !workOn.has(c.n) && (planMarker(c) || {}).ready === "decide",
      can: "wait on a question only the owner can answer", is: "waits on a question only the owner can answer" }
  ];
  const takeable = c => c.kind === "ready" && !HOLDS.some(h => h.held(c));
  const holding = (cards, form) => HOLDS.filter(h => cards.some(h.held)).map(h => h[form]);
  /* Whether a planned card may be called ready to build. That is a free card
     with nothing open in its `needs`, so the plan line's suffix, the label's
     sentence and the build marker's gloss all ask `takeable`, the test the
     notes and the chain bar ask. Reading only `needs` lets a deferred,
     decision or parent card with a `build` verdict read "ready to build"
     directly under a kind word saying not to start it, so a card contradicts
     itself. `takeable` reads no `needs`, because the bar and
     the notes say a blocker in their own words, so the blocker is added here. */
  const buildable = c => takeable(c) && !c.needs.some(b => by.has(b));
  /* The same arrangement as `planMarker`, for the same reason. The card and the
     legend have to agree about whether a position is drawn, and the way they
     stay agreed is that the rule exists once. It is short enough to look safe
     to inline twice, which is exactly how `planMarker` drifted.

     What it suppresses is the position on a deferred card. The sort forces such
     a card last whatever the ranking says, so a chip reading 6 above a card
     reading last is two answers to one question. A deferred card is in the
     ranking only to record that it is deliberately not being done, which the
     dashed border and the kind word already say. */
  const rankMark = c => c.kind === "deferred" ? null : (rankWhy.get(c.n) || null);
  /* A third thing the marker can mean, for a loop run on a card that has
     already exited one. Without it the card reads "ready to build" under a
     heading saying the plan is still being written, a card contradicting where
     it sits.

     Suppressing the marker would be worse. The plan really was run against the
     code, and a second loop re-measures it rather than doubting it, usually
     because merges landed after the verdict. So the marker keeps its swatch and
     says what is true of it now.

     It asks `planMarker` rather than `planOf`, so it calls a plan re-measured
     only where the card draws the marker. A card with an open branch, or one
     merged with no `Part of`, draws none, and asking `planOf` let the flow
     legend explain "a second loop re-measuring it" for a marker no card drew. */
  const remeasuring = c => {
    const w = workOn.get(c.n);
    return !!(w && w.kind !== "build" && planMarker(c));
  };

  /* A card in flight is drawn once, in the section that says whose move it is,
     and left out of the depth columns. Showing it twice is what made the note
     below say a card was free to pick up two sentences after saying nobody
     should start it. */
  const flight = flightOf({ by, planOf, workOn, prOf });
  /* Only the ranked cards unless the reader asked for all. `rankMark` already
     leaves out a deferred card, so a deferral written on an issue keeps it off
     the default view too. The column counts and the free-card sentence count
     what was drawn. The depth and freeing sentences count every open issue, and
     each says so when that includes cards this view hides.

     And only the chosen milestone, so the build order, the line above it, the
     depth sentence and the free list read that milestone alone. Under one
     milestone a parent in it shows too. A parent builds nothing, so it is never
     ranked, and the ranked-only view would otherwise always hide the card its
     children name as what they serve. */
  const open = TRACKER.filter(c => !flight.has(c.n) && inMs(c));
  const rest = open.filter(c => SHOW_ALL || rankMark(c) || (MS !== MS_ALL && c.kind === "parent"));
  SHOWN = rest.length; HIDDEN = open.length - rest.length;
  SHOWN_RANKED = rest.filter(c => rankMark(c)).length;
  /* Relaxed to a fixed point rather than resolved in one walk, so a card ends up
     right of everything it waits on however the list happens to be ordered. */
  const depth = new Map(TRACKER.map(c => [c.n, 0]));
  for (let pass = 0; pass < 12; pass++) {
    let moved = false;
    TRACKER.forEach(c => {
      const d = c.needs.filter(b => by.has(b)).reduce((m, b) => Math.max(m, depth.get(b) + 1), 0);
      if (d !== depth.get(c.n)) { depth.set(c.n, d); moved = true; }
    });
    if (!moved) break;
  }

  const feeds = new Map();
  TRACKER.forEach(c => c.needs.forEach(b => {
    if (!feeds.has(b)) feeds.set(b, []);
    feeds.get(b).push(c.n);
  }));

  /* The fourth column follows the tracker rather than the cards drawn, so the
     Show all choice and the In flight section never add or drop it. */
  const dataCol = TRACKER.some(c => c.kind === "data");
  const bucket = dataCol ? [[], [], [], []] : [[], [], []];
  rest.forEach(c => {
    if (dataCol && c.kind === "data") { bucket[3].push(c); return; }
    bucket[Math.min(depth.get(c.n), 2)].push(c);
  });
  /* Within a column, a card with an executed plan sorts above one without,
     because depth says what may be started and this says what can be handed
     over. Ties fall back to the issue number, which is stable. */
  bucket.forEach(col => col.sort(cardOrder(by, planOf)));

  const host = document.getElementById("board");
  host.classList.toggle("data", dataCol);
  host.innerHTML = bucket.map((col, k) => {
    const cards = col.map(card).join("");
    return `<div class="col k${k}">
      <div class="ch"><span class="t">${COLS[k][0]}</span><span class="c">${col.length}</span>
        <span class="d">${COLS[k][1]}</span></div>${cards}</div>`;
  }).join("");

  function card(c) {
      /* Every pull request against the card draws its line, merged and closed
         ones included, because the line says what became of each one against
         an issue still open. Only an open one is a branch carrying the card, so
         `live` is what draws the accent border. The label names an open one
         ahead of the rest for the same reason. With none open it names a
         merged one with no `Part of`, since that is the pull request the board
         note holds the card for, and only then whichever entry comes first. */
      const ps = prOf.get(c.n) || [];
      const live = openBranches(prOf, c.n)[0];
      const p = live || ps.find(q => q.state === "merged" && !q.partOf) || ps[0];
      const waits = c.needs.filter(b => by.has(b));
      const soft = (c.after || []).filter(b => by.has(b));
      const note = waits.length
        ? `waits on ${waits.map(b => `<a href="${ISS}${b}" target="_blank" rel="noopener">#${b}</a>`).join(" ")}`
        : "";
      /* The kind word gets its own line rather than sharing the blocker's. The
         two used to be one slot holding whichever applied, so a blocker silently
         hid the kind. That stays invisible while every blocked card is ordinary
         work, whose kind word is empty. A parent blocked by its three children
         then reads as "waits on" its children and nothing else, so a reader
         takes it for work that frees up when they land, which is the opposite of
         what it is.

         An open pull request still suppresses it, and so does one merged with
         no `Part of`, which `kindShown` decides and explains. The chain bar
         asks the same function before giving a kind as a reason. A blocker is
         not an answer to what kind of thing the card is. */
      const kindword = kindShown(c) ? (KINDWORD[c.kind] || "") : "";
      /* "nothing blocks it" is only true when nothing does. The clause was
         written when `after` and `needs` had never appeared on one card, so it
         asserted the absence of a blocker as part of announcing an ordering. A
         card carrying both then read "waits on" one issue directly above
         "nothing blocks it", which is two sentences contradicting each other on
         one card. The ordering is the part that is always true, so that is what
         is always said, and the absence of a blocker is said only when the line
         above has not just named one. */
      const softnote = soft.length
        ? `<div class="wo">${waits.length ? "it should also land after" :
            "nothing blocks it, and it should land after"} ${
            soft.map(b => `<a href="${ISS}${b}" target="_blank" rel="noopener">#${b}</a>`).join(" ")}</div>`
        : "";
      let prline = "";
      ps.forEach(p => {
        const ck = checkword(p.rollup);
        /* A merged or closed pull request reports the review state it carried
           when it stopped being open, which says nothing useful afterwards, so
           the state word takes that slot instead. */
        const right = p.state === "open"
          ? `<span class="rv">${esc(p.review)}</span>`
          : `<span class="rv">${esc(p.state)}</span>`;
        /* `Part of` registers no closing link on purpose, because the issue
           keeps what the branch does not do, so the line says so plainly. A
           closed pull request will never merge and closes nothing, so it gets
           no such sentence. */
        const loose = p.state !== "closed" && p.partOf
          ? `<span class="nolink">part of #${c.n}, which stays open for what this does not do</span>`
          : "";
        prline += `<div class="pr">
          <a href="${PRU}${p.pr}" target="_blank" rel="noopener">PR #${p.pr}</a>
          <span class="sep">&middot;</span><span class="ck ${ck[0]}">${esc(ck[1])}</span>
          <span class="sep">&middot;</span>${right}
          ${loose}
        </div>`;
      });
      const wk = workOn.get(c.n);
      /* No card draws the session's `what` phrase. A card with a session and no
         open branch sits under "Building" or "Being planned", whose heading names
         the session, and such phrases mostly repeated that heading's verb and
         then the card's title. Under "Waiting on my review" a phrase describes
         work the branch has already replaced. The `busy` stripe and its legend
         entry say a session still holds the card, and the flow note says what
         the branch still owes.

         A session marks its card with a `working:` label, which has no room for
         a phrase, so the screen-reader label names the kind of session instead,
         after the title it already opens with. Once a branch is open the label
         says which kind of session still holds the card, because the stripe
         looks the same for both: a build session is still on the branch, and a
         decompose loop, which never touches the branch, is still revising the
         plan. An entry with no `kind` counts as a loop, as it does everywhere
         else. The same open-branch test
         `flightCols` uses decides it, so the label and the column cannot
         disagree. */
      const onBranch = wk && !!live;
      /* A finished plan stops being news once somebody is carrying it out,
         which `planMarker` above decides and explains. The sort still reads
         `planOf` rather than the marker, so a planned card keeps its position
         whether or not the marker is drawn. */
      const pn = planMarker(c);
      const rank = rankMark(c);
      /* The label carries every visible line that says whether the card can be
         started. Without them a card that waits on an issue reads to a screen
         reader as a card waiting on nothing, and a deferred card reads as
         ordinary work. All three are here: the blocker, the measured ordering,
         and the kind word. The update-build-board skill's harness
         strips attributes before
         printing, so it cannot see this surface at all and a rule added here is
         checked by reading the template. */
      const says = [];
      if (waits.length) says.push(`It waits on ${andlist(waits.map(b => "issue " + b))}.`);
      if (soft.length) says.push((waits.length ? `It should also land after ` :
        `Nothing blocks it, and it should land after `) +
        `${andlist(soft.map(b => "issue " + b))}.`);
      if (kindShown(c) && KINDSAYS[c.kind]) says.push(KINDSAYS[c.kind]);
      return `<div class="tk k-${c.kind}${live ? " has-pr" : ""}${wk ? " busy" : ""}${
        pn ? " plan-" + pn.ready : ""}" data-n="${c.n}" tabindex="0" role="button"
        aria-label="Issue ${c.n}. ${esc(c.label)}.${says.length ? " " + esc(says.join(" ")) : ""}${p ? ` Pull request ${p.pr} is ${p.state} against it.` : ""}${onBranch ? (wk.kind === "build" ? ` Its build session is still on the branch.`
          : ` A decompose loop is still revising its plan.`) : wk ? ` A ${wk.kind === "build" ? "build session" : "decompose loop"} is working it.` : ""}${
          pn ? ` Its plan is complete after ${plu(pn.passes, "pass")}.` +
            /* The label says what the visible line says. It used to read "ready
               to decide", which is not a state, while the line under the card
               read "waits on an owner call". An owner call is owed whatever else
               blocks the card, and only the handover to a builder is not, so the
               two branches differ. The harness strips attributes, so this
               surface is checked by reading the template. */
            (remeasuring(c) ? ` A second loop is re-measuring that plan.`
              : pn.ready === "decide" ? ` It waits on a question only the owner can answer.`
              : buildable(c) ? ` It is ready to build.` : "") : ""
        }${rank ? ` It is number ${rankPos.get(c.n) + 1} in the priority order.` : ""} Show what this connects to.">
        <div class="r1">
          <a class="id" href="${ISS}${c.n}" target="_blank" rel="noopener">#${c.n}</a>
          <span class="sl">${esc(c.ms)}</span>
          ${rank ? `<span class="rk" title="priority order">${rankPos.get(c.n) + 1}</span>` : ""}
        </div>
        <div class="lb">${esc(c.label)}</div>
        ${(c.labels || []).length ? `<div class="lbs">${c.labels
          .map(l => `<b style="color:${LABEL_HUE[l] || "var(--faint)"}">${esc(l)}</b>`)
          .join("")}</div>` : ""}
        ${note ? `<div class="wo">${note}</div>` : ""}
        ${softnote}
        ${kindword ? `<div class="wo">${kindword}</div>` : ""}
        ${pn ? `<div class="pl ${pn.ready}">plan complete, ${plu(pn.passes, "pass")}${
          remeasuring(c) ? ", being re-measured"
            : pn.ready === "decide" ? ", waits on an owner call"
            : buildable(c) ? ", ready to build" : ""}</div>` : ""}

        ${prline}
      </div>`;
  }

  /* Crossing arrows across the columns are harder to read than one chain on
     demand, so the links are traced by picking a card.

     One chain spans both sections. A card in flight is drawn only under In
     flight, so a tracer confined to the depth board could neither be started
     from a card whose branch is open nor light that card up as the blocker of
     one still waiting below. Both grids take the same highlight, and each
     section carries its own copy of the chain line so the answer shows beside
     whichever card was picked. */
  const bar = document.getElementById("chainbar");
  const hosts = [host, document.getElementById("flow")].filter(Boolean);
  const bars = [bar, document.getElementById("flowchain")].filter(Boolean);
  const say = html => bars.forEach(b => { b.innerHTML = html; });
  const unpick = () => hosts.forEach(h => {
    h.classList.remove("picking");
    h.querySelectorAll(".tk").forEach(e => e.classList.remove("on", "root"));
  });
  const reach = (start, map) => {
    const seen = new Set(), stack = [start];
    while (stack.length) {
      const id = stack.pop();
      (map.get(id) || []).forEach(nx => { if (!seen.has(nx)) { seen.add(nx); stack.push(nx); } });
    }
    return seen;
  };
  const needsMap = new Map(TRACKER.map(c => [c.n, c.needs.filter(b => by.has(b))]));
  /* The In flight section draws only the chosen milestone too, so a card in
     flight elsewhere is not drawn, and the chain bar must not count it as
     drawn. */
  const drawn = new Set([...rest.map(c => c.n), ...[...flight].filter(n => inMs(by.get(n)))]);
  const clear = () => {
    unpick();
    say(`<span class="hint">Pick a card to trace what it waits on and what waits on it.</span>`);
  };
  const pick = n => {
    const up = reach(n, needsMap), down = reach(n, feeds);
    if (!up.size && !down.size) {
      /* No `needs` either way, which says nothing about whether the card can be
         started, so that half of the sentence reads `takeable` and `HOLDS`, the
         tests the board note's free list reads. A card held for a reason no
         table row names, such as a kind added later without a row, is told only
         what its links show. Every reason in the list holds for this one card, so they
         take "and", unlike the board note's alternatives.

         `after` is a link too, and the card itself says it should land after
         what it names, so a card tied by one either way is not called linked
         to nothing. Nothing enforces it, so it leaves the free claim alone. */
      const c = by.get(n);
      const before = (c.after || []).filter(b => by.has(b));
      const later = TRACKER.filter(x => (x.after || []).includes(n)).map(x => "#" + x.n);
      const reasons = holding([c], "is");
      const lead = before.length || later.length
        ? `Nothing here blocks <b>#${n}</b> or waits on it` : `<b>#${n}</b> is linked to nothing else here`;
      say(`<span>${lead}${takeable(c) ? ", so it can be taken on its own."
          : reasons.length ? `, but it is not free to take, because it ${andlist(reasons)}.` : "."}` +
        `${before.length ? ` It should land after ${andlist(before.map(b => "#" + b))}.` : ""}` +
        `${later.length ? ` ${andlist(later)} should land after it.` : ""}</span>` +
        `<button type="button" data-clear>Clear</button>`);
      unpick();
      return;
    }
    hosts.forEach(h => {
      h.classList.add("picking");
      h.querySelectorAll(".tk").forEach(e => {
        const v = +e.dataset.n;
        e.classList.toggle("root", v === n);
        e.classList.toggle("on", up.has(v) || down.has(v));
      });
    });
    /* `reach` walks the whole chain, while the card's own line names only what
       it waits on directly. A bare "waits on 2" on a card whose line names one
       issue counts a chain as blockers. So the
       chain's total is given beside the direct count whenever the two differ. */
    const bits = [];
    const nearUp = needsMap.get(n).length, nearDown = (feeds.get(n) || []).length;
    if (up.size) bits.push(nearUp === up.size ? `waits on ${up.size}`
      : `waits on ${nearUp} directly and ${up.size} along the whole chain`);
    if (down.size) bits.push(nearDown === down.size ? `${down.size} waiting on it`
      : `${nearDown} waiting on it directly and ${down.size} along the whole chain`);
    /* The short view leaves cards out, and a chain through them lights nothing,
       so the line says how many it could not show rather than leaving the reader
       to wonder where they went. */
    /* A card in another milestone is hidden by the milestone filter, which
       Show all does not lift, so it is named with its milestone rather than
       counted in the Show all clause. */
    const unseen = [...up, ...down].filter(v => !drawn.has(v));
    const away = unseen.filter(v => !inMs(by.get(v))).sort((a, b) => a - b);
    const short = unseen.length - away.length;
    if (short) bits.push(`${short} of them hidden, so press Show all to see ${short === 1 ? "it" : "them"}`);
    if (away.length) bits.push(`${andlist(away.map(v => `#${v} (${esc(msName(by.get(v).ms))})`))} ` +
      `${away.length === 1 ? "is" : "are"} in another milestone, so the milestone filter hides ` +
      `${away.length === 1 ? "it" : "them"}`);
    say(`<span><b>#${n}</b> &middot; ${bits.join(" &middot; ")}</span>` +
      `<button type="button" data-clear>Clear</button>`);
  };
  let cur = null;
  hosts.forEach(h => {
    h.onclick = e => {
      if (e.target.closest("a")) return;
      const card = e.target.closest(".tk");
      if (!card) return;
      const n = +card.dataset.n;
      if (cur === n) { cur = null; clear(); } else { cur = n; pick(n); }
    };
    h.onkeydown = e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".tk"); if (!card) return;
      e.preventDefault(); card.click();
    };
  });
  bars.forEach(b => { b.onclick = e => { if (e.target.matches("[data-clear]")) { cur = null; clear(); } }; });
  /* One Escape listener, replaced on each draw. This page draws once, so a new
     listener per draw costs nothing here, but a page sharing this renderer that
     redraws on live data would stack one per draw, each holding the grids of the
     draw that made it. */
  if (CHAIN_ESC) document.removeEventListener("keydown", CHAIN_ESC);
  CHAIN_ESC = e => { if (e.key === "Escape" && cur !== null) { cur = null; clear(); } };
  document.addEventListener("keydown", CHAIN_ESC);
  clear();

  inFlight({ by, planOf, workOn, prOf, card, takeable, holding });

  /* Each key lists what its own section actually drew. A fixed list would
     describe cards that are not under it, which is what happened the moment
     the pull requests moved to In flight. */
  const legend = (id, pairs) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = pairs.map(([c, w]) =>
      `<span><i class="${c}"></i>${esc(w)}</span>`).join("");
  };
  const drew = (set, f) => set.some(f);
  /* Declared here rather than beside the flow legend, because both legends call
     it and the rule has to exist once. That is the same arrangement `planMarker`
     and `rankMark` already carry, and for the same reason.

     A legend drawing no plan marker while the depth board draws them accounts
     for fewer marks than its own cards. It bites on a `PLANNED` card an open
     blocker keeps out of the In flight section, which is rare, because most
     planned cards are either free or already carried. */
  const marked = r => c => !remeasuring(c) && (planMarker(c) || {}).ready === r;
  /* The build marker's gloss is read off the cards that drew it rather than
