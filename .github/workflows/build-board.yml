name: Build board

# Rebuilds a repository's build board from GitHub and publishes it on GitHub
# Pages, so no session has to measure and write it by hand. Every repository
# that has a board calls this workflow from a short caller,
# .github/workflows/board.yml, which holds the triggers, the permissions and
# the concurrency group. scripts/build_board.py reads every figure through the
# API and writes board.json, and the page is
# .claude/skills/update-build-board/board.html.
#
# Provenance: the build and deploy jobs of .github/workflows/board.yml in
# l3a0/quantitative-trading at commit 6da0ee3, landed here by the pull request
# that closes l3a0/repo-template#24. On the way the jobs moved behind
# workflow_call, the triggers and the concurrency group moved to the caller,
# the generator and the page are checked out from this repository at the
# caller's pinned ref, and a `title` input names the board. An `icon` input,
# added by the pull request that closes l3a0/repo-template#29, lets a
# repository serve its own tab icon in place of the template's. A `data-label`
# input, added by the pull request that closes l3a0/repo-template#40, names
# the label that marks a card waiting on data, which the page then draws in a
# fourth column. Two on-or-off inputs, `label-colors` and `sort-labels`, added
# by the pull request that closes l3a0/repo-template#41, fill each label chip
# with the colour GitHub stores for the label and sort each card's labels by
# name.
#
# The generator and the page come from the commit this workflow was read at,
# which `job.workflow_repository` and `job.workflow_sha` name. Inside a called
# workflow the `github` context still describes the caller, so
# `github.workflow_sha` would name the caller's commit instead. A repository
# that pins this workflow to a commit therefore gets that commit's generator
# and page as well, and its board changes only when it moves the pin.
#
# Three rules decide what code runs in this workflow. The first two keep out
# anyone who can file an issue or open a pull request, and also keep it inside
# the ruleset, which refuses a merge while CodeQL reports a high or critical
# alert. The third keeps out whoever can move an action's tag.
#
# 1. No step reads the event payload. Anyone can file an issue on a public
#    repository, so an issue title expanded into a run step would run as
#    shell. The generator reads everything through gh, which also makes a
#    run's output independent of the event that started it.
# 2. The caller runs on pull_request_target, which carries a write token on
#    the default branch, so nothing here checks out a pull request's code. The
#    caller's own checkout takes the default ref, and the other takes this
#    workflow's commit.
# 3. Every action is named by a full commit SHA, with its release in a
#    trailing comment. A tag can be moved to another commit. The deploy job
#    holds pages: write and id-token: write, and the build job's upload
#    decides what it publishes, so whoever moved a tag would choose what runs
#    with those scopes or what they publish. A SHA cannot be moved.
#    Dependabot's github-actions entry rewrites a SHA and its comment together.
on:
  workflow_call:
    inputs:
      title:
        description: The page's heading. Empty gives "<name> build board".
        type: string
        default: ""
      icon:
        description: >-
          A path in the calling repository to the .ico file served as the
          board's tab icon, such as .github/board/favicon.ico. Empty serves
          the template's icon.
        type: string
        default: ""
      data-label:
        description: >-
          The label marking an issue that waits on data to be bought or
          captured, such as blocked-on-data. Its cards draw in a "Waiting on
          data" column. Empty reads no such label.
        type: string
        default: ""
      label-colors:
        description: >-
          "true" fills each label chip with the colour GitHub stores for that
          label. Empty draws the page's own colours, where a label the page
          does not know draws faint.
        type: string
        default: ""
      sort-labels:
        description: >-
          "true" sorts each card's labels by name. Empty keeps the order
          GitHub returns, which is the order the labels were added.
        type: string
        default: ""

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declaring any scope sets every unlisted one to none, so each scope the
    # generator reads is named. The caller's job grants at least these.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      updated_at: ${{ steps.board.outputs.updated_at }}
    steps:
      # The caller's workflow file, because the generator reads the schedule
      # from its cron line to say when the board is stale, and the caller's
      # icon when it names one. actions/checkout drops an empty line from
      # this list, so an empty `icon` leaves the workflow file alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller
          sparse-checkout: |
            .github/workflows/board.yml
            ${{ inputs.icon }}
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: template
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Build board.json from GitHub
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          DATA_LABEL: ${{ inputs.data-label }}
          LABEL_COLORS: ${{ inputs.label-colors }}
          SORT_LABELS: ${{ inputs.sort-labels }}
        run: >-
          python3 template/scripts/build_board.py build
          --repo "$GITHUB_REPOSITORY"
          --workflow caller/.github/workflows/board.yml
          --title="$TITLE"
          --data-label="$DATA_LABEL"
          --label-colors="$LABEL_COLORS"
          --sort-labels="$SORT_LABELS"
          --out _site

      # Pages serves index.html at the site's root. The page links its icon
      # as favicon.ico beside it, so the icon goes in the same folder. The
      # caller's icon, when it names one, takes the template's place. A named
      # file that is missing fails the run, because a board deployed without
      # it would show a blank tab rather than the icon the caller asked for.
      - name: Add the page
        env:
          ICON: ${{ inputs.icon }}
        run: |
          cp template/.claude/skills/update-build-board/board.html _site/index.html
          if [ -n "$ICON" ]; then
            cp "caller/$ICON" _site/favicon.ico
          else
            cp template/.claude/skills/update-build-board/favicon.ico _site/favicon.ico
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Every successful run deploys, including one whose board matches the last
  # apart from its stamp. Skipping that deploy would freeze the stamp, and the
  # page would then call a current board stale.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: template
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      # Records how long the board took to be served and whether a plain fetch
      # gets past Pages' ten-minute cache. It never fails the run. The run holds
      # the caller's pages concurrency group while it measures, so the next run
      # waits on it, and --wait caps that at a minute of polling.
      - name: Measure delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          UPDATED_AT: ${{ needs.build.outputs.updated_at }}
        run: >-
          python3 template/scripts/build_board.py measure
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --page-url "$PAGE_URL"
          --updated-at "$UPDATED_AT"
          --wait 60
